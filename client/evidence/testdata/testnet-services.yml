# Reassembled from the testnet provider's canonical service blocks — provider
# 0x1cB95Eb66Cc67C62d4DE0CC96726C5A5d82e7C85 on contract 0xa79F4c8311FF93C06b8CfB403690cc987c93F91E,
# compose_hash 9b0de348…, broker v0.5.4, read 2026-10-15.
#
# NOT that provider's docker_compose_file. It is the eleven service bodies `pcverify
# -provider -blocks` printed for it, in their FULL form (real image references), wrapped
# back into a document. Everything outside `services:` is absent, so the review reports
# shared-mount findings this file does not mean; the per-service blocks are byte-identical
# to the authenticated ones, which is the only thing the baseline comparison reads.
#
# Regenerate together with the testnet deployment in brokercompose.json from one `-blocks`
# run. They are two projections of the same observation.

services:
  broker-ingress:
    logging:
        driver: json-file
        options:
            max-size: 50m
            max-file: "3"
    image: dstacktee/dstack-ingress:2.2@sha256:d05a7b343c37c1cca1bba8dbf7e8f3c6d2118158af2d41c455103796db4f67f0
    ports:
        - 443:443
    environment:
        - CLOUDFLARE_API_TOKEN=${TESTNET_CLOUDFLARE_API_TOKEN}
        - DOMAIN=${TESTNET_DOMAIN:?set TESTNET_DOMAIN — there is no default, so that a missing value cannot point this deployment at production}
        - TARGET_ENDPOINT=http://0g-serving-provider-broker:3080
        - CERTBOT_EMAIL=${TESTNET_CERTBOT_EMAIL}
        - GATEWAY_DOMAIN=_.${TESTNET_DSTACK_GATEWAY_DOMAIN}
        - SET_CAA=true
        - PORT=443
        - TIMEOUT_CONNECT=10s
        - TIMEOUT_SERVER=900s
    volumes:
        - zg-tee-ro:/var/run/zg-tee-ro
        - testnet-cert-data:/etc/letsencrypt
    entrypoint:
        - bash
        - -c
        - ln -sfn /var/run/zg-tee-ro/tee.sock /var/run/dstack.sock && exec /scripts/entrypoint.sh "$@"
        - --
    command:
        - haproxy
        - -W
        - -f
        - /etc/haproxy/haproxy.cfg
    restart: unless-stopped
    depends_on:
        0g-serving-provider-broker:
            condition: service_healthy
  0gm-sglang:
    image: lmsysorg/sglang:v0.5.17-cu129@sha256:220bb1a1a4b38e604ebd33c876a279f6d2519035de141200720417407c9b967d
    container_name: 0gm-sglang
    restart: unless-stopped
    init: true
    ipc: host
    shm_size: 32gb
    runtime: nvidia
    environment:
        NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
        NVIDIA_DRIVER_CAPABILITIES: compute,utility
        HF_HOME: /dstack/persistent/hf-cache
        HF_TOKEN: ${HF_TOKEN:-}
    volumes:
        - /dstack/persistent/hf-cache:/dstack/persistent/hf-cache
        - /dstack/persistent/benchmark/sglang_0gm_logs:/logs
    command:
        - python3
        - -m
        - sglang.launch_server
        - --model-path
        - 0G-AI/0GM-1.0-35B-A3B-0427
        - --revision
        - 802e58f5c8211f04079bfb5c27fb2c6ab629b686
        - --served-model-name
        - 0GM-1.0-35B-A3B-0427
        - --host
        - 0.0.0.0
        - --port
        - "8000"
        - --tp-size
        - "1"
        - --mem-fraction-static
        - "0.90"
        - --context-length
        - "262144"
        - --reasoning-parser
        - qwen3
        - --tool-call-parser
        - qwen3_coder
        - --speculative-algorithm
        - NEXTN
        - --speculative-num-steps
        - "3"
        - --speculative-eagle-topk
        - "1"
        - --speculative-num-draft-tokens
        - "4"
        - --mamba-scheduler-strategy
        - extra_buffer
        - --enable-metrics
        - --enable-cache-report
    healthcheck:
        test:
            - CMD-SHELL
            - python3 -c "import urllib.request;urllib.request.urlopen('http://localhost:8000/health_generate',timeout=15)"
        interval: 30s
        timeout: 20s
        start_period: 90m
        retries: 3
    ulimits:
        memlock: -1
        stack: 67108864
    logging:
        driver: json-file
        options:
            max-size: 50m
            max-file: "3"
    networks:
        default:
            aliases:
                - sglang
                - vllm
  mysql:
    logging:
        driver: json-file
        options:
            max-size: 50m
            max-file: "3"
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    restart: unless-stopped
    environment:
        - MYSQL_ROOT_PASSWORD=123456
        - MYSQL_DATABASE=provider
        - MYSQL_USER=provider
        - MYSQL_PASSWORD=provider
    volumes:
        - testnet-mysql-data:/var/lib/mysql
    healthcheck:
        test:
            - CMD-SHELL
            - mysql -uroot -p123456 -e 'USE provider'
        interval: 15s
        timeout: 5s
        retries: 15
        start_period: 60s
    networks:
        - default
  broker-config-init:
    logging:
        driver: json-file
        options:
            max-size: 50m
            max-file: "3"
    image: alpine:3.18@sha256:de0eb0b3f2a47ba1eb89389859a9bd88b28e82f5826b6969ad604979713c2d4f
    environment:
        - TESTNET_BROKER_CONFIG=${TESTNET_BROKER_CONFIG:-}
        - TESTNET_PRIVATE_KEY=${TESTNET_PRIVATE_KEY:-}
        - COINGECKO_API_KEY=${COINGECKO_API_KEY:-}
    volumes:
        - testnet-broker-config:/config
    command:
        - sh
        - -c
        - |
          set -e
          # First boot only. The controller's PUT /v1/config/core writes this same
          # file and records the change in RTMR3, so rewriting it on every start
          # would silently undo an operator change that is already on-chain — the
          # same guard dstack's own boot script puts on docker-compose.yaml.
          if [ ! -f /config/config.yaml ]; then
            if [ -z "$$TESTNET_BROKER_CONFIG" ]; then
              echo "BROKER_CONFIG is empty and no config exists yet" >&2
              exit 1
            fi
            printf '%s' "$$TESTNET_BROKER_CONFIG" | base64 -d \
              | sed -e "s#\$${PRIVATE_KEY}#$$TESTNET_PRIVATE_KEY#" \
                    -e "s#\$${COINGECKO_API_KEY}#$$COINGECKO_API_KEY#" \
              > /config/config.yaml.tmp
            # Rename last, so a container killed mid-write leaves no half-file that
            # the guard above would then accept as complete.
            mv /config/config.yaml.tmp /config/config.yaml
          fi
    restart: no
  0g-serving-provider-broker:
    logging:
        driver: json-file
        options:
            max-size: 50m
            max-file: "3"
    container_name: 0g-serving-provider-broker
    image: ghcr.io/0gfoundation/0g-serving-broker@sha256:951f4c7971f87377ab077639a5a84d2aed8945460494da076ff8466ea1ee90b5
    environment:
        - PORT=3080
        - CONFIG_FILE=/etc/config/config.yaml
        - TARGET_URL=http://0gm-sglang:8000/v1
        - DATABASE_DSN=root:123456@tcp(mysql:3306)/provider?parseTime=true
        - NETWORK=phala
        - IMAGE_REPO=ghcr.io/0gfoundation/0g-serving-broker
        - IMAGE_DIGEST=sha256:951f4c7971f87377ab077639a5a84d2aed8945460494da076ff8466ea1ee90b5
        - TEE_SOCKET=/var/run/zg-tee/tee.sock
    volumes:
        - testnet-broker-config:/etc/config:ro
        - testnet-broker-logs:/var/log/inference
        - testnet-event-logs:/var/log/event
        - zg-tee:/var/run/zg-tee
    command: 0g-inference-server
    networks:
        - default
    healthcheck:
        test:
            - CMD-SHELL
            - test -L /proc/1/exe && readlink /proc/1/exe | grep -q broker
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 60s
    deploy:
        resources:
            reservations:
                devices:
                    - driver: nvidia
                      count: all
                      capabilities:
                        - gpu
    restart: unless-stopped
    depends_on:
        0g-controller:
            condition: service_started
        mysql:
            condition: service_healthy
        0gm-sglang:
            condition: service_healthy
        broker-config-init:
            condition: service_completed_successfully
  0g-serving-provider-event:
    logging:
        driver: json-file
        options:
            max-size: 50m
            max-file: "3"
    container_name: 0g-serving-provider-event
    image: ghcr.io/0gfoundation/0g-serving-broker@sha256:951f4c7971f87377ab077639a5a84d2aed8945460494da076ff8466ea1ee90b5
    environment:
        - CONFIG_FILE=/etc/config/config.yaml
        - NETWORK=phala
        - IMAGE_REPO=ghcr.io/0gfoundation/0g-serving-broker
        - IMAGE_DIGEST=sha256:951f4c7971f87377ab077639a5a84d2aed8945460494da076ff8466ea1ee90b5
        - TEE_SOCKET=/var/run/zg-tee/tee.sock
    volumes:
        - testnet-broker-config:/etc/config:ro
        - testnet-event-logs:/var/log/inference
        - zg-tee:/var/run/zg-tee
    command: 0g-inference-event
    networks:
        - default
    healthcheck:
        test:
            - CMD-SHELL
            - grep -q '0g-inference-event' /proc/1/cmdline
        interval: 30s
        timeout: 5s
        retries: 3
        start_period: 30s
    restart: unless-stopped
    depends_on:
        0g-controller:
            condition: service_started
        0g-serving-provider-broker:
            condition: service_healthy
  0g-controller:
    logging:
        driver: json-file
        options:
            max-size: 50m
            max-file: "3"
    container_name: 0g-controller
    ports:
        - 3090:3090
    image: ghcr.io/0gfoundation/0g-serving-broker@sha256:951f4c7971f87377ab077639a5a84d2aed8945460494da076ff8466ea1ee90b5
    environment:
        - CONFIG_FILE=/etc/config/config.yaml
        - ATTEST_PROXY_SOCKET=/var/run/zg-tee/tee.sock
        - ATTEST_PROXY_READONLY_SOCKET=/var/run/zg-tee-ro/tee.sock
    volumes:
        - testnet-broker-config:/etc/config
        - /var/run/dstack.sock:/var/run/dstack.sock
        - /var/run/docker.sock:/var/run/docker.sock
        - zg-tee:/var/run/zg-tee
        - zg-tee-ro:/var/run/zg-tee-ro
        - testnet-controller-logs:/var/log/inference
    depends_on:
        broker-config-init:
            condition: service_completed_successfully
    command: 0g-controller
    networks:
        - default
    healthcheck:
        test:
            - CMD-SHELL
            - grep -q '0g-controller' /proc/1/cmdline
        interval: 30s
        timeout: 5s
        retries: 3
        start_period: 30s
    restart: unless-stopped
  prometheus-init:
    logging:
        driver: json-file
        options:
            max-size: 50m
            max-file: "3"
    image: alpine:3.18@sha256:de0eb0b3f2a47ba1eb89389859a9bd88b28e82f5826b6969ad604979713c2d4f
    environment:
        - TESTNET_PROMETHEUS_CONFIG=${TESTNET_PROMETHEUS_CONFIG:-}
    volumes:
        - testnet-prometheus-config:/tmp
    command: |
        sh -c 'if [ -n "$$TESTNET_PROMETHEUS_CONFIG" ]; then
          echo "$$TESTNET_PROMETHEUS_CONFIG" | base64 -d > /tmp/prometheus.yml
        else
          cat > /tmp/prometheus.yml << "EOF"
        global:
          scrape_interval: 15s
        scrape_configs:
          - job_name: "0g-serving"
            static_configs:
              - targets: ["0g-serving-provider-broker:3080", "0g-serving-provider-event:3081"]
        EOF
        fi'
  prometheus:
    logging:
        driver: json-file
        options:
            max-size: 50m
            max-file: "3"
    image: prom/prometheus:v2.45.2@sha256:8cf63a779c484564428c8ab5aa61899f41b72e92232d930b2b001661d978bed8
    restart: unless-stopped
    volumes:
        - testnet-prometheus-config:/etc/prometheus
    networks:
        - default
    healthcheck:
        test:
            - CMD
            - wget
            - --no-verbose
            - --tries=1
            - --spider
            - http://localhost:9090/-/healthy
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 30s
    depends_on:
        prometheus-init:
            condition: service_completed_successfully
  grafana:
    logging:
        driver: json-file
        options:
            max-size: 50m
            max-file: "3"
    image: grafana/grafana-oss:11.4.0@sha256:d8ea37798ccc41061a62ab080f2676dda6bf7815558499f901bdb0f533a456fb
    restart: unless-stopped
    volumes:
        - ./grafana/provisioning:/etc/grafana/provisioning
        - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
        - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    networks:
        - default
    healthcheck:
        test:
            - CMD-SHELL
            - curl -f http://localhost:3000/api/health || wget -q --spider http://localhost:3000/api/health
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 60s
    depends_on:
        prometheus:
            condition: service_healthy
  dcgm-exporter:
    logging:
        driver: json-file
        options:
            max-size: 50m
            max-file: "3"
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.4.0-ubuntu22.04@sha256:ab1e183c2ccd5820db379027f58cb928af29c2e8a87dd6decc39afac9f15d677
    restart: unless-stopped
    runtime: nvidia
    environment:
        - NVIDIA_VISIBLE_DEVICES=all
        - DCGM_EXPORTER_NO_HOSTNAME=1
    networks:
        - default
    expose:
        - 9400
    depends_on:
        prometheus:
            condition: service_healthy
