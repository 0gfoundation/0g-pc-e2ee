# !reset drops the node it tags before the document is decoded. On a key that would
# otherwise override a merged one, that UNDOES the override: the merged value is what
# runs.
x-base: &base
  privileged: true
  cap_add: [SYS_ADMIN]
services:
  app:
    image: app
    <<: *base
    privileged: !reset false
    cap_add: !reset []
