# Dependabot covers Sigstore's verifier only (sigstore-go, go-tuf, in-toto).
#
# Falling behind there is how a Sigstore format change becomes a verification failure on
# providers — in pcverify, and in the gateway's and the sidecar's runtime_release — so its
# updates arrive as PRs and are checked by ci.yml, security.yml and broker-release.yml like
# any other change. Everything else in these modules is what the sealed binaries are built
# from and moves only by deliberate change, hence the allow list.
#
# Both modules that require it, in one update: pcverify resolves its own versions, so a
# bump to the client module alone would leave pcverify's go.sum behind.
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /client
      - /client/cmd/pcverify
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    allow:
      - dependency-name: "github.com/sigstore/*"
      - dependency-name: "github.com/theupdateframework/*"
      - dependency-name: "github.com/in-toto/*"
    groups:
      sigstore:
        patterns:
          - "github.com/sigstore/*"
          - "github.com/theupdateframework/*"
          - "github.com/in-toto/*"
    commit-message:
      prefix: "provenance"
