name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Every module builds with the toolchain protocol/go.mod pins; read it from there.
          go-version-file: protocol/go.mod
          cache-dependency-path: protocol/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l protocol client)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      # client/cmd/pcverify is its own module (see its go.mod for why, and why that reason
      # has lapsed).
      - name: vet, build, test (per module)
        run: |
          set -e
          for m in protocol client client/cmd/pcverify; do
            echo "::group::$m"
            ( cd "$m" && go vet ./... && go build ./... && go test -race ./... )
            echo "::endgroup::"
          done

  switch-sh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # shellcheck and jq ship on the ubuntu-latest image.
      - name: shellcheck
        run: shellcheck deploy/phala/switch.sh deploy/phala/switch_test.sh scripts/smoke-gateway.sh

      - name: switch.sh tests
        run: deploy/phala/switch_test.sh
