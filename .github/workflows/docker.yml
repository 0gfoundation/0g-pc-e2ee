name: Docker

# Build the sidecar, gateway and tls-init images. On pull requests we build only (to
# catch breakage); on pushes to main and on version tags we also publish to GHCR.
# tls-init is deploy/tapp's key-fetching sidecar (deploy/tapp/tls-init/Dockerfile).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to GHCR with GITHUB_TOKEN
    strategy:
      fail-fast: false
      matrix:
        include:
          # Context is the repo root for the Go images: client depends on protocol
          # via a local `replace`, so both module trees must be in the build context.
          - service: sidecar
            file: client/cmd/sidecar/Dockerfile
            context: .
          - service: gateway
            file: client/cmd/gateway/Dockerfile
            context: .
          # Downloads a checksummed tapp-cli release binary; needs nothing from here.
          - service: tls-init
            file: deploy/tapp/tls-init/Dockerfile
            context: deploy/tapp/tls-init
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Only log in when we intend to push (skip on pull_request from forks).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives tags + OCI labels. image.source label here is what links the
      # published package to this repo on GHCR.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Full 40-char SHA so release.yml can map any input commit to its
            # image tag deterministically (no short-SHA ambiguity).
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
