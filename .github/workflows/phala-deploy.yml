name: Phala deploy

# Creates one blue/green side of the gateway as a NEW Phala Cloud app from a
# published release, and waits until it can serve: deploy/phala/deploy-side.sh, run
# from a runner. With `switch` ticked it then cuts traffic over to it, through the
# "DNS switch" workflow (`switch <side>`) under its own approval; otherwise that
# stays a separate run. blue-green.md, "Deploying a side from GitHub Actions", has
# the setup.
#
#   plan    admins only; resolves the release (default: the newest release-*) and
#           the side: `inactive` is the main side the traffic switch does not name,
#           read from public DNS now (deploy-side.sh --resolve-side). Every later
#           job uses that resolved side, so issuance is aimed at the side that is
#           then deployed; if traffic moves while the run waits for approval,
#           deploy-side.sh refuses the side as live.
#   acme    calls dns-switch.yml with `acme <side>`, so the new side's ingress can
#           answer its ACME challenge on first boot. Waits for approval under
#           dns-<target>, which holds the Cloudflare token for the switch records.
#   deploy  deploy-side.sh under deploy-<target>: preflight, create, wait; then
#           the smoke test, when the environment has an API key for it. With
#           `replace`, it first writes `switch.sh status` into the run summary and
#           has deploy-side.sh delete the side's previous CVM (--replace) just
#           before creating the new one — only that CVM, and only after every
#           other check has passed.
#   switch  only with `switch` ticked, not on a dry run, and only after deploy
#           (and its smoke test) succeeded: dns-switch.yml with `switch <side>`,
#           waiting for its own approval under dns-<target> — the point to look at
#           the deploy's summary first, which says when the switch crosses
#           clusters. switch.sh gates the side again (published app-address,
#           /readyz, a trusted certificate) and rolls itself back, issuance
#           included, if the cutover does not verify.
#   acme-restore
#           only when deploy fails or is cancelled after acme moved: dns-switch.yml
#           with `acme live`, handing issuance back to the side serving traffic.
#           Another approval under dns-<target>.
#
# The side's previous CVM has to go first: the script refuses to create a side
# that still has one, so it never upgrades in place. Tick `replace` to have it
# deleted here, or delete it by hand (phala cvms delete).
# `acme` runs before that refusal can be seen, so a refused or failed deploy leaves
# the issuance switch on a side that is not serving, and the live side cannot renew
# until it moves back. acme-restore moves it back; if its approval is declined or
# it fails, run DNS switch `acme` with side `live` yourself (weeks of margin, but
# do not forget). A deploy that succeeds keeps it: `switch` moves it with traffic.
#
# Config is the checked-in deploy/phala/env/<target>.env; the Environments hold
# only secrets.
#
# THE SECRETS HERE ARE THE DEPLOYMENT, as in dns-switch.yml: the Phala API key can
# create and delete the CVMs, and the CVM's Cloudflare token can point the served
# name anywhere. They live ONLY in Environment secrets — deploy-staging and
# deploy-mainnet, each admitting only main and with required reviewers — and only
# the deploy job names that environment. A fork's pull request never runs this
# workflow (dispatch-only).
#
# Logs are public in a public repository. deploy-side.sh prints names, app ids
# and DNS records, never the CVM's env; the values go to a
# 0600 temp file and are encrypted to the CVM by the CLI. Actions masks secrets
# regardless.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment"
        required: true
        type: choice
        options: [staging, mainnet]
      side:
        description: "Side to create: inactive = the main side traffic is not on"
        required: true
        type: choice
        default: inactive
        options: [inactive, a, b, c]
      release:
        description: "Release tag (release-YYYY.MM.DD.N), or latest"
        required: false
        type: string
        default: latest
      switch:
        description: "Then switch traffic to it (DNS switch, its own approval under dns-<target>)"
        required: false
        type: boolean
        default: false
      replace:
        description: "Delete the side's previous CVM first (only that one; refused if it is ambiguous)"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Preflight only: point nothing, create nothing, delete nothing"
        required: false
        type: boolean
        default: true
      smoke:
        description: "Run scripts/smoke-gateway.sh against the new side (needs SMOKE_API_KEY)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

# One deploy per deployment at a time. Its own group, not dns-switch's: the acme
# job runs dns-switch.yml, whose group would otherwise wait on this run forever.
concurrency:
  group: phala-deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read # releases, and the implicit metadata read the permission lookup needs
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      side: ${{ steps.side.outputs.side }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Public DNS only (the delegation zone's own nameserver), and the checked-in
      # env file for DOMAIN and the zone: no secret is in this job.
      - id: side
        name: Resolve the side
        env:
          TARGET: ${{ inputs.target }}
          SIDE: ${{ inputs.side }}
        run: |
          set -euo pipefail
          ./deploy/phala/deploy-side.sh "$SIDE" --env-file "deploy/phala/env/${TARGET}.env" \
            --resolve-side >> "$GITHUB_OUTPUT"

      - id: plan
        env:
          TARGET: ${{ inputs.target }}
          SIDE: ${{ steps.side.outputs.side }}
          ASKED_SIDE: ${{ inputs.side }}
          REPLACE: ${{ inputs.replace }}
          SWITCH: ${{ inputs.switch }}
          RELEASE: ${{ inputs.release }}
          DRY_RUN: ${{ inputs.dry_run }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          permission="$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" --jq .permission)" \
            || fail "could not read ${ACTOR}'s permission on ${REPO}; refusing"
          [ "$permission" = admin ] \
            || fail "${ACTOR} has '${permission}' on ${REPO}; only an admin may deploy"

          # Only tags release.yml makes. "latest" is the newest of those by creation
          # time, not GitHub's "Latest" badge, which another kind of release could take.
          tag_re='^release-[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$'
          releases="$(gh release list --repo "$REPO" --limit 200 --exclude-drafts \
            --json tagName,createdAt,isPrerelease)"
          if [ "$RELEASE" = latest ]; then
            tag="$(jq -r --arg re "$tag_re" '[.[] | select((.tagName | test($re)) and (.isPrerelease | not))]
              | sort_by(.createdAt) | last | .tagName // empty' <<<"$releases")"
            [ -n "$tag" ] || fail "no release-* release found"
          else
            [[ "$RELEASE" =~ $tag_re ]] || fail "release must be latest or release-YYYY.MM.DD.N"
            tag="$RELEASE"
          fi
          # Pinned here, so what is approved is what is deployed even if a newer
          # release is published while the run waits.
          assets="$(gh release view "$tag" --repo "$REPO" --json assets,targetCommitish \
            --jq '[.targetCommitish, (.assets[].name)] | @tsv')" || fail "no release ${tag}"
          grep -qw docker-compose.release.yml <<<"$assets" \
            || fail "release ${tag} has no docker-compose.release.yml"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          {
            echo "### Phala deploy: side \`$SIDE\` on $TARGET (asked: \`$ASKED_SIDE\`)"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| release | [\`$tag\`](https://github.com/${REPO}/releases/tag/${tag}) (asked: \`$RELEASE\`) |"
            echo "| commit | \`$(cut -f1 <<<"$assets")\` |"
            echo "| dry run | $DRY_RUN |"
            echo "| replace | $REPLACE$([ "$REPLACE" = true ] && echo " — deletes side \`$SIDE\`'s previous CVM before creating") |"
            if [ "$SWITCH" = true ] && [ "$DRY_RUN" = true ]; then
              echo "| switch | requested, but not on a dry run: nothing is created to switch to |"
            elif [ "$SWITCH" = true ]; then
              echo "| switch | yes — after a successful deploy, \`switch $SIDE\` under \`dns-${TARGET}\` (its own approval) |"
            else
              echo "| switch | no — cut over yourself with **DNS switch** afterwards |"
            fi
            echo "| environments | \`dns-${TARGET}\` (acme$([ "$SWITCH" = true ] && echo ', switch')), \`deploy-${TARGET}\` (create) |"
            echo "| triggered by | @$ACTOR |"
          } >> "$GITHUB_STEP_SUMMARY"

  # The issuance switch, aimed at the side before it exists: its ingress issues
  # the certificate on first boot (blue-green.md, fast path step 1).
  acme:
    needs: plan
    permissions:
      contents: read
    uses: ./.github/workflows/dns-switch.yml
    # A called workflow sees no secrets at all — not even those of the
    # environment its own job names — unless the caller passes them. inherit
    # does not loosen anything: CF_API_TOKEN lives only in dns-<target>, and the
    # called job still waits for that environment's approval before it gets it.
    secrets: inherit
    with:
      target: ${{ inputs.target }}
      command: acme
      side: ${{ needs.plan.outputs.side }}
      dry_run: ${{ inputs.dry_run }}

  deploy:
    needs: [plan, acme]
    runs-on: ubuntu-latest
    # Boot and image pull, first certificate, a cold warmer sweep, then the smoke
    # test: deploy-side.sh's own waits add up to ~55 minutes at most.
    timeout-minutes: 90
    environment: deploy-${{ inputs.target }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch the release compose
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$REPO" --pattern docker-compose.release.yml \
            --dir "$RUNNER_TEMP/release"
          sha256sum "$RUNNER_TEMP/release/docker-compose.release.yml"

      # Pinned. deploy-side.sh uses it to list CVMs (the preflight's "does this
      # side still have one"); creating is provision.cjs's.
      - name: Install the Phala CLI
        run: npm install --global --ignore-scripts phala@1.1.22

      # provision.cjs creates the CVM (the CLI cannot pin the node; see its header).
      # Its one dependency, the Phala SDK, from the committed lockfile.
      - name: Install provision.cjs's dependency
        working-directory: deploy/phala
        run: npm ci --ignore-scripts --no-audit --no-fund

      # What is live, what each side publishes and whether it answers, at the
      # moment before deploy-side.sh deletes one of them — so the summary shows
      # what the deletion was made against. Read-only: switch.sh status with the
      # CVM's token, which can read the delegation zone. A failure here is noted,
      # and does not stop the deploy; deploy-side.sh does its own checks.
      - name: Status before deleting
        if: ${{ inputs.replace }}
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TARGET: ${{ inputs.target }}
          SIDE: ${{ needs.plan.outputs.side }}
          NO_COLOR: "1"
        run: |
          set -uo pipefail
          rc=0
          out="$(./deploy/phala/switch.sh --env-file "deploy/phala/env/${TARGET}.env" status 2>&1)" || rc=$?
          printf '%s\n' "$out"
          {
            echo "#### \`switch.sh status\` before deleting side \`$SIDE\`'s previous CVM"
            echo
            echo '```'
            printf '%s\n' "$out"
            echo '```'
            [ "$rc" = 0 ] || echo "_switch.sh status exited ${rc}; the deploy goes on, with deploy-side.sh's own checks._"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: deploy-side.sh
        id: deploy
        env:
          # Secrets only: the Phala API key, and the CVM's. Everything else is
          # the checked-in deploy/phala/env/<target>.env — not mapped from
          # Environment variables, which would shadow the file (the real environment
          # wins, and a mapped-but-unset variable is set, to empty).
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZG_PROM_REMOTE_WRITE_URL: ${{ secrets.ZG_PROM_REMOTE_WRITE_URL }}
          ZG_PROM_REMOTE_WRITE_USERNAME: ${{ secrets.ZG_PROM_REMOTE_WRITE_USERNAME }}
          ZG_PROM_REMOTE_WRITE_PASSWORD: ${{ secrets.ZG_PROM_REMOTE_WRITE_PASSWORD }}
          # The CORS allowlist: some of its sites are not public. A SECRET, never a
          # variable: Actions prints every step's env at the top of its log, masking
          # secrets only, and this repository's logs are public. Required by both env
          # files, so an unset (empty) secret stops the deploy.
          CVM_ENV_ZG_GATEWAY_ALLOWED_ORIGINS: ${{ secrets.ZG_GATEWAY_ALLOWED_ORIGINS }}
          # The HMAC key the gateway signs X-0G-Client-IP with (hex, >= 32 bytes),
          # the same value as the router's client-ip-hmac-keys secret. A secret for
          # the obvious reason. Required by both env files (CVM_REQUIRED_KEYS): the
          # router believes the header on both targets, so a deploy without it
          # fails instead of putting every user back in one bucket.
          CVM_ENV_ZG_GATEWAY_CLIENT_IP_KEY: ${{ secrets.ZG_GATEWAY_CLIENT_IP_KEY }}
          # Optional: KEY=VALUE lines for the CVM that stay out of the repository
          # (none today). Unset is empty, and empty adds nothing.
          CVM_SECRET_ENV: ${{ secrets.CVM_SECRET_ENV }}
          TARGET: ${{ inputs.target }}
          SIDE: ${{ needs.plan.outputs.side }}
          TAG: ${{ needs.plan.outputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPLACE: ${{ inputs.replace }}
        run: |
          set -euo pipefail
          args=("$SIDE" --env-file "deploy/phala/env/${TARGET}.env" --compose "$RUNNER_TEMP/release/docker-compose.release.yml" --release "$TAG")
          if [ "$REPLACE" = true ]; then args+=(--replace); fi
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); else args+=(--yes); fi
          # The log streams to the job log and is kept for the summary; stdout (the
          # app_id and url lines) goes to fd 3 and on to the step outputs.
          rc=0
          { ./deploy/phala/deploy-side.sh "${args[@]}" 2>&1 >&3 | tee deploy.log >&2; } 3> result.txt || rc=$?
          cat result.txt >> "$GITHUB_OUTPUT"
          # deploy-side.sh says when the new side is in another cluster than the
          # live one: the cutover then moves the serving alias and has a short
          # window. Raised as an annotation, which the run page shows above the
          # pending switch approval, and kept as an output for the summary below.
          if grep -q 'serving alias across clusters' deploy.log; then
            echo "cross_cluster=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Cross-cluster switch::side ${SIDE} runs in another cluster than the live side: switching to it moves the serving alias, and clients holding the old one can fail for up to its TTL (60 s). blue-green.md, Cross-cluster fallback."
          fi
          {
            echo '```'
            cat deploy.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      # Through the side's own -443s host, before any traffic points at it: that
      # host serves the served domain's certificate, so --insecure, and the key
      # crosses a connection nothing authenticated. Use a key with a small credit
      # limit for it.
      - name: Smoke test
        if: ${{ !inputs.dry_run && inputs.smoke }}
        env:
          ZG_API_KEY: ${{ secrets.SMOKE_API_KEY }}
          URL: ${{ steps.deploy.outputs.url }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [ -z "$ZG_API_KEY" ]; then
            echo "::notice::SMOKE_API_KEY is not set in this environment; skipping the smoke test"
            exit 0
          fi
          conf() { sed -n "s/^$1=//p" "deploy/phala/env/${TARGET}.env" | tail -n1; }
          SEALED="$(conf SMOKE_SEALED_MODEL)"
          PLAIN="$(conf SMOKE_PLAIN_MODEL)"
          args=(--insecure --gateway "$URL")
          [ -z "$SEALED" ] || args+=(--sealed-model "$SEALED")
          [ -z "$PLAIN" ] || args+=(--plain-model "$PLAIN")
          ./scripts/smoke-gateway.sh "${args[@]}"

      - name: Next step
        if: ${{ !inputs.dry_run }}
        env:
          SIDE: ${{ needs.plan.outputs.side }}
          TARGET: ${{ inputs.target }}
          SWITCH: ${{ inputs.switch }}
          CROSS: ${{ steps.deploy.outputs.cross_cluster }}
        run: |
          {
            echo
            if [ "$SWITCH" = true ]; then
              echo "Side \`$SIDE\` is ready. The **switch** job now waits for approval under \`dns-${TARGET}\` to cut traffic over to it."
            else
              echo "Side \`$SIDE\` is ready. Cut over with **DNS switch** → \`$TARGET\`, \`switch\`, side \`$SIDE\`."
            fi
            if [ "$CROSS" = true ]; then
              echo
              echo "> ⚠️ **Cross-cluster switch.** Side \`$SIDE\` runs in another cluster than the live side, so the cutover moves the serving alias: clients still holding the old one can fail for up to its TTL (60 s). Prefer a quiet time (blue-green.md, *Cross-cluster fallback*)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The cutover, when asked for: only after the side deployed and passed its
  # smoke test, and under its own approval, so whoever approves can read the
  # deploy's summary first. Its failures need no handling here: switch.sh refuses
  # a side that fails its gates before writing anything, and a cutover that does
  # not verify is rolled back by switch.sh itself, issuance included. Not part of
  # acme-restore's condition: a failed switch leaves issuance where switch.sh put
  # it, with the live side.
  switch:
    needs: [plan, deploy]
    if: ${{ inputs.switch && !inputs.dry_run }}
    permissions:
      contents: read
    uses: ./.github/workflows/dns-switch.yml
    secrets: inherit
    with:
      target: ${{ inputs.target }}
      command: switch
      side: ${{ needs.plan.outputs.side }}
      dry_run: false

  # Without this, a deploy refused at its preflight (the side still has a CVM, say)
  # or failing later leaves issuance on a side that serves nothing, and the live
  # side's next renewal fails. `live` is read from the traffic switch when this
  # runs, not remembered from before the deploy. always(): a cancelled run needs it
  # as much as a failed one. Not after a dry run, which moved nothing.
  acme-restore:
    needs: [acme, deploy]
    if: ${{ always() && !inputs.dry_run && needs.acme.result == 'success' && needs.deploy.result != 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/dns-switch.yml
    secrets: inherit
    with:
      target: ${{ inputs.target }}
      command: acme
      side: live
      dry_run: false
