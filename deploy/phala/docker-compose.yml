# Phala Cloud (dstack) deployment for the 0G-PC cloud-TEE gateway.
#
# Runs the `gateway` — the same client core as the sidecar, but server-run and
# 0G-operated — inside an attested CVM, behind dstack-ingress. dstack-ingress
# terminates TLS *inside this CVM* (the key is generated in the enclave and never
# leaves it) and forwards plaintext to the gateway over the compose network, so the
# gateway must NOT do TLS and the two have to share one compose / one CVM. Two more
# containers ride along: `cvm-identity`, a one-shot init container naming this
# replica, and `prometheus-agent`.
#
# EVERY byte below is measured into compose_hash — images, volumes, depends_on, env
# blocks. Editing this file, comments included, changes compose_hash, and so the
# mr_config_id every quote from this CVM commits to.
#
# AN EDIT ALSO COSTS A CERTIFICATE. A new compose_hash is an upgrade, an upgrade
# brings up a fresh CVM, and a fresh CVM has an EMPTY cert-data volume — so
# dstack-ingress issues again, against the budget of 5 duplicate certificates per
# hostname per rolling week. Batch edits rather than trickling them.
#
# The same fact is the ONLY way to move a hostname from the staging CA to the real
# one: with the volume intact, `certbot renew` finds a certificate that is not near
# expiry and exits before contacting any CA, so flipping ACME_STAGING to false
# changes nothing and the staging certificate keeps being served, silently. Set
# ACME_STAGING=false first, THEN make the edit, so the fresh CVM issues once and
# against the right CA. Measured on a live deployment — see README "Serving domain".
#
# It does NOT change app_id. dstack assigns an app its id when the app is CREATED and
# then keeps it for the app's life (dstack-util system_setup.rs: the derivation
# `truncate(compose_hash, 20)` runs only when nothing assigned one, which for a
# KMS-enabled app on Phala Cloud is never). So an in-place compose update moves
# compose_hash under a fixed app_id, and `compose_hash[:20]` is this deployment's
# app_id only until its first upgrade — do not compute one from the other.
#
# What the attestation proves, how to check it, and the rationale behind the
# settings here:
#   docs/design/cloud-gateway.md §5.3/§6  — design and trust model
#   docs/verifying-the-gateway.md         — how a user verifies a deployment
#   deploy/phala/README.md                — operator runbook, env, and Notes
#
# Deploy: reference this file from the Phala Cloud dashboard or the Phala CLI, with
# the environment and DNS records in README "Serving domain".

services:
  # Publishes THIS CVM's identity (instance_id / app_id) to the others, then exits.
  # An init container, not a service.
  #
  # Several CVMs can back one app_id (blue-green.md "Scaling one side"), and every
  # container here is byte-identical to its counterpart in the sibling replica, so
  # none can tell which one it is: the answer lives behind the guest-agent socket and
  # compose interpolation cannot see a value the runtime assigns per CVM. Doing the
  # lookup here is also what lets the GATEWAY drop that socket — the guest agent
  # derives keys and issues quotes, and this container touches it for one call and
  # exits, whereas the gateway runs for the life of the CVM handling user prompts.
  cvm-identity:
    # Keep this pin identical to the gateway's below: same image, one artifact — it
    # already contains this binary. The release workflow substitutes both lines with
    # one digest, so they cannot end up on different builds.
    image: ghcr.io/0gfoundation/0g-pc-e2ee-gateway:latest
    # `entrypoint:`, not `command:`: the image's ENTRYPOINT is the gateway and it
    # declares no CMD, so a `command:` would be appended to it rather than replace
    # it. Root, because the shared volume is created root-owned by docker and the
    # image's default user is `nonroot`.
    entrypoint: ["/usr/local/bin/cvmid"]
    user: "0:0"
    command:
      - "-out-identity"
      - "/run/identity/identity.json"
      # This CVM's app-compose.json, verbatim, for the gateway's self-description
      # endpoint (GET /v1/gateway/identity, issue #78) — it is what names the
      # containers running in here. Same guest-agent call as the identity above, so
      # publishing it costs nothing extra and keeps the gateway off that socket. The
      # gateway checks these bytes against the quote's compose_hash before reading
      # anything out of them; absent or stale costs the container list and nothing
      # else.
      - "-out-app-compose"
      - "/run/identity/app-compose.json"
      # One file_sd document per scrape job — they must NOT share one, or each job
      # would discover the other's target. These carry the identity as TARGET
      # labels, the only mechanism that also reaches `up` and the other per-scrape
      # series (Prometheus builds those from target labels alone, never from the
      # exposition), which is why both jobs go through here.
      - "-prom-sd"
      - "/run/identity/sd/gateway.json=gateway:9464"
      - "-prom-sd"
      - "/run/identity/sd/prom-agent.json=localhost:9090"
    # Runs once. `unless-stopped` would restart it forever after each clean exit.
    restart: "no"
    volumes:
      # Held briefly — one call, then this container exits. dstack-ingress mounts the
      # same socket for the life of the CVM.
      - /var/run/dstack.sock:/var/run/dstack.sock
      - identity:/run/identity

  dstack-ingress:
    # Official upstream image. 2.3 is the floor: it is the first release with the
    # DNS-01 DELEGATION_ZONE feature (Dstack-TEE/dstack-examples #104/#108).
    image: dstacktee/dstack-ingress:2.3@sha256:527c53523b9226782a11dbd800a3ff55e8a1f0b88e6224e8f7e4db7419769fbe
    restart: unless-stopped
    # HEALTHY, not merely created: HAProxy resolves the `gateway` backend name once
    # at startup, so coming up before the gateway serves risks a dead backend on
    # first boot. This closes the startup race only — a gateway recreated with a new
    # address later still needs an ingress restart.
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      # Publishes 443 on the CVM so the dstack gateway can reach HAProxy in here. It
      # passes SNI it holds no wildcard cert for straight through at L4, taking the
      # target from the `_dstack-app-address` TXT record, so TLS is never terminated
      # outside this CVM. NOTE: the platform forwards only SNI suffixes it has been
      # configured for — a new domain suffix must be allowlisted by Phala first.
      - "443:443"
    environment:
      - DNS_PROVIDER=cloudflare
      # `:?` on the OPERATOR-supplied vars on purpose: one a human forgot to set
      # must fail the deploy loudly rather than degrade. (GATEWAY_DOMAIN below is
      # not one of those and is deliberately ungated — see its note.) An empty
      # DELEGATION_ZONE in particular is not a no-op — it switches the container out
      # of delegation mode, at which point it tries to write records into the SERVED
      # domain's own zone with a token that has no access there.
      - DOMAIN=${DOMAIN:?set DOMAIN, e.g. pc-gateway.example.com}
      # NOT an operator secret. DSTACK_GATEWAY_DOMAIN is exported by Phala Cloud's
      # pre-launch script — app-compose.json `pre_launch_script`, which dstack
      # `source`s into the very shell that then runs docker compose — so it always
      # names the cluster this CVM actually booted in. Typing the cluster by hand is
      # how a CVM ends up pointing at a different one, and under blue/green that
      # mistake is SILENT: the record this value lands in there
      # (`<DOMAIN>.<side>.<DELEGATION_ZONE>`) is in no resolution path at all. See
      # blue-green.md, "Where GATEWAY_DOMAIN does and does not matter".
      #
      # The `_.` is ours: the platform exports the bare base domain, dstack-ingress
      # wants the gateway form. Spelled exactly as Phala's own custom-domain example
      # spells it, deliberately — this line should stay diff-clean against upstream
      # so a reader can see it is the stock recipe and not a local invention.
      #
      # NO `:?` here, unlike the three operator-supplied vars around it. Those are
      # secrets a human forgets; this one is injected, and the two ways it can go
      # wrong are not ones `:?` catches. If the platform exports nothing, this
      # interpolates to the literal `_.` — non-empty, so a guard on the whole
      # expression never fires; guarding the inner variable instead would work, but
      # it fails the compose at PARSE time, taking the gateway down with the ingress
      # over a value that under blue/green nothing reads. Left ungated, the blast
      # radius is the ingress alone: it tries to write `_.` as a CNAME target, the
      # provider rejects it, and that container crash-loops with the reason in its
      # log while the gateway keeps serving. If the platform ever exports the `_.`
      # form itself, this yields `_._.<base>` and compose cannot defend either way
      # (interpolation has no prefix stripping; `${VAR#_.}` is an interpolation
      # error). Evidence it is bare today: the same pre-launch script builds
      # `DSTACK_APP_DOMAIN=$DSTACK_APP_ID"."$DSTACK_GATEWAY_DOMAIN`, a hostname only
      # if the value carries no `_.`.
      #
      # So the check is at deploy time, on the record that actually gets published —
      # README "Serving domain".
      - GATEWAY_DOMAIN=_.${DSTACK_GATEWAY_DOMAIN}
      - DELEGATION_ZONE=${DELEGATION_ZONE:?set DELEGATION_ZONE, the zone this container may write}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:?set CLOUDFLARE_API_TOKEN, scoped to DELEGATION_ZONE only}
      - TARGET_ENDPOINT=gateway:8443 # forward decrypted traffic to the gateway
      # Default `wait` blocks on boot until the served CNAMEs resolve to
      # `<name>.<DOMAIN>.<DELEGATION_ZONE>` — a strict one-hop match, correct for a
      # single instance. Blue/green (blue-green.md) pins the served CNAMEs at the
      # base zone while each side lives under its own sub-zone, so that one-hop
      # pre-check never matches and a side would block: use DNS_SETUP_MODE=print
      # there, which skips only this pre-check (issuance and routing follow the full
      # chain). Enter it on every side and toggle by VALUE — Phala Cloud builds
      # allowed_envs from the keys you actually enter, that list is itself measured,
      # so skipping the key changes compose_hash AND leaves the container unable to
      # receive the var at all until a redeploy.
      - DNS_SETUP_MODE=${DNS_SETUP_MODE:-wait}
      # Least privilege: the container manages every record it needs inside the
      # delegation zone, so the token needs NO access to the served domain's own
      # zone. The operator creates three static CNAMEs there once, before first boot
      # — see README "Serving domain" — and never touches DNS again, not even when
      # app_id changes.
      #
      # ACME_EMAIL is deliberately NOT declared — it is optional, and anything set
      # here ends up world-readable in /evidences/acme-account.json.
      #
      # Staging CA; false = real, publicly-trusted certs. Set true in the encrypted
      # env to bring a NEW hostname up first — staging's rate limits are far higher
      # than the 5-duplicate-certs-per-week budget, and its certs are untrusted
      # (smoke tests only). Toggled by value like DNS_SETUP_MODE above; a staging and
      # a production run share app_id, and the served cert's issuer is what tells
      # them apart.
      - ACME_STAGING=${ACME_STAGING:-false}
      # Hand the /evidences/ route to the gateway (ZG_GATEWAY_EVIDENCE_DIR below),
      # which serves the same bytes with a CORS header this pinned image cannot add
      # — issue #73. Gates only this container's mini_httpd and the HAProxy ACL in
      # front of it; the bundle is still WRITTEN here, unconditionally. Trust is
      # unaffected: the bundle is self-authenticating, so who serves it is not part
      # of what is proven. README "Public evidence bundle" has the rest.
      - EVIDENCE_SERVER=false
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock # in-enclave attestation + cert binding
      - cert-data:/etc/letsencrypt
      # Writable here: this container PRODUCES the bundle. The gateway mounts the same
      # volume read-only and is what serves it.
      - evidences:/evidences

  gateway:
    # Published by .github/workflows/docker.yml to GHCR.
    #
    # DEVELOPMENT: floating `:latest` so a fresh build is picked up on redeploy
    # without editing this file. This DEFEATS the attestation story and MUST be
    # re-pinned before any attested / production deploy: compose_hash covers the
    # app-compose manifest, which embeds this file verbatim, so a floating tag keeps
    # compose_hash — and therefore mr_config_id and the quote — identical while the
    # code that sees plaintext user prompts changes underneath it. (app_id would not
    # have moved either way; see the header.) Restore the digest pin
    # (`…-gateway@sha256:<digest>`) and re-pin deliberately on every upgrade; see
    # README "Pin the image digest".
    image: ghcr.io/0gfoundation/0g-pc-e2ee-gateway:latest
    restart: unless-stopped
    # Wait for the identity file, so the gateway's first log line already carries
    # instance_id — it reads the file ONCE at startup, so a race here costs the
    # dimension for the life of the process. cvm-identity still exits 0 when the
    # guest agent does not answer, precisely so a telemetry problem cannot hold the
    # gateway down; only an unwritable volume (a broken deploy) fails it.
    depends_on:
      cvm-identity:
        condition: service_completed_successfully
    # Deliberately NOT published to the host: a published 8443 would also be served
    # at `<app-id>-8443.<base_domain>`, where the dstack gateway — not this CVM —
    # terminates TLS, under a cert with no binding to this app. dstack-ingress
    # reaches the gateway over the compose network instead.
    expose:
      - "8443"
      - "9464" # internal Prometheus /metrics (see ZG_GATEWAY_METRICS_LISTEN below)
    # The image is distroless (no shell, no curl), so the probe is the gateway binary
    # itself: `gateway -health` does one GET /healthz against its own listen port.
    # This is what lets dstack-ingress gate on `service_healthy` above.
    # /healthz asserts only that the process is serving, deliberately — the stronger
    # "can it serve" question is /readyz, which the blue/green cutover probes and
    # this must NOT become (blue-green.md, "Health-checking the standby side").
    healthcheck:
      test: ["CMD", "/usr/local/bin/gateway", "-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      # Grace before failures count: the gateway must parse config, dial the router,
      # and (with -warm) prime the quote cache before it is "up".
      start_period: 30s
    # Same env-var contract as the sidecar (flag > env var > default). Values are
    # spelled out rather than left to the binary's defaults because this block is
    # measured — a reader should see the configuration app_id commits to. See README
    # "Notes" for the reasoning behind each setting.
    environment:
      # Same reachability as the binary's own default (`:8443`), pinned here per the
      # note above. Must STAY all-interfaces — a localhost bind would be unreachable
      # from dstack-ingress across the compose network.
      - "ZG_GATEWAY_LISTEN=0.0.0.0:8443"
      # Prometheus /metrics on a separate internal listener, never published to the
      # host and not fronted by dstack-ingress, so it is reachable only over the
      # compose network — by the prometheus-agent below. Empty/unset disables it.
      - "ZG_GATEWAY_METRICS_LISTEN=0.0.0.0:9464"
      # The gateway routes per request and derives each provider's enc key + signer
      # from the broker, so no provider or key is configured up front. Unset (prod) →
      # the 0G production router; inject ZG_GATEWAY_ROUTER_URL via the encrypted env
      # (staging) → that URL, listing it in allowed_envs or dstack drops it. The
      # measured text is the ${…} form, so staging and prod share app_id: attestation
      # does not distinguish which router was used, which is acceptable only because
      # the router is untrusted by construction.
      #
      # ⚠️ This is the router's ORIGIN name, and it must never be router-api.0g.ai.
      # That name is the PUBLIC ENTRY, i.e. this gateway: pointed there, every
      # passthrough request and every route-preview re-enters our own front door and
      # recurses. The router is reachable directly at the name below, which is what
      # this must stay — including in whatever you inject for staging.
      - "ZG_GATEWAY_ROUTER_URL=${ZG_GATEWAY_ROUTER_URL:-https://router-api-cloud.0g.ai}"
      # Browser origin allowlist (CORS): the 0G first-party app origins, and
      # deliberately not every origin the router accepts. An empty value turns browser
      # access off entirely; SDK and server-side callers send no Origin header and are
      # unaffected.
      #
      # This list is also what decides whether AMBIENT CREDENTIALS are on: a named
      # allowlist (this) admits the router's `jwt` cookie and answers
      # Access-Control-Allow-Credentials, while a value of "*" turns both off. So each
      # entry now means "this page may act as a logged-in visitor", not merely "this
      # page may call us with its own key" — the router issues that cookie with
      # SameSite=None, so the browser attaches it cross-site and this list is the only
      # thing standing in the way.
      #
      # It therefore deliberately does NOT mirror openaiproxy.DefaultAllowedOriginsCSV
      # any more: the two localhost entries in that constant are a convenience for a
      # local `go run`, and on a public deployment they would extend the session to
      # whatever a developer happens to be serving on those ports. Keep prod to the
      # first-party origins.
      - "ZG_GATEWAY_ALLOWED_ORIGINS=${ZG_GATEWAY_ALLOWED_ORIGINS:-https://0g.ai,https://*.0g.ai}"
      # The global-entry knob.
      # Referenced with its OFF default rather than left out, for the same reason
      # ACME_STAGING is referenced: a variable this file does not mention can never
      # reach the container, so leaving it out would mean the cutover needs a compose
      # edit — a new compose_hash, a new measurement, a redeploy — at the moment it can
      # least afford one. Referenced with a default, the value switches through the
      # encrypted env and the measured text is untouched. It must therefore be entered
      # in allowed_envs on EVERY side, including while it is "refuse", and toggled by
      # value (README "Serving domain", and blue-green.md on why a drifting
      # allowed_envs list is its own problem).
      #
      # There is deliberately NO companion variable for cookie credentials: the
      # router's `jwt` cookie is admitted, and the CORS answer is credentialed,
      # whenever ZG_GATEWAY_ALLOWED_ORIGINS names its origins rather than saying "*".
      # See the long note at the gateway's -allowed-origins flag for why that is not a
      # knob — in short, a deployment cannot detect whether it is the one serving the
      # router's hostname, and the setting could only ever be forgotten in the
      # direction that breaks the whole first-party app with a CORS error rather than
      # a 401.
      # ZG_GATEWAY_SEAL_POLICY decides whether this gateway SEALS at all.
      # "always" (the default, and today's behaviour) seals every sealed surface's
      # POST; "off" seals nothing and proxies those paths to the router in the clear,
      # marked X-0G-E2EE: none — behaviourally the plain router.
      #
      # ⚠️ The global-entry cutover sets this to "off", and that is the whole point:
      # pointing router-api.0g.ai at a gateway that seals unconditionally would, in
      # one DNS change, also turn default encryption on for everybody — the provider
      # pool narrows to the sealable endpoints, web search and file attachments break
      # by construction, and every request pays a route-preview plus an HPKE seal.
      # DNS cutover is a deploy; the sealing default is a release, and they get
      # separate decisions.
      #
      # The default stays "always" so that nothing changes for the deployments
      # running today: a gateway that says nothing keeps sealing. An unrecognised
      # value fails startup rather than guessing — there is no safe direction to
      # guess in when the question is "is this encrypted".
      - "ZG_GATEWAY_SEAL_POLICY=${ZG_GATEWAY_SEAL_POLICY:-always}"
      # ZG_GATEWAY_SEAL_MODELS narrows WHICH models get sealed. Empty (the default)
      # seals every model — the behaviour before this existed. A comma-separated list
      # seals only those and proxies the rest to the router in the clear, marked
      # X-0G-E2EE: none.
      #
      # This is the rollout dial. Only a couple of chat models have E2EE support on
      # the network, so sealing everything fails the rest (a model with no sealable
      # provider gets an empty route-preview, which the client treats as TERMINAL),
      # while sealing nothing gives up encryption for the models that do work.
      # Add a model, watch, add the next.
      #
      # ⚠️ Declared HERE, with an inert default, ON PURPOSE — even though nobody is
      # using it yet. Adding a key to allowed_envs changes the measured app-compose
      # and so compose_hash, which is an upgrade, which brings up a fresh CVM with an
      # EMPTY cert-data volume and re-issues the certificate. Let's Encrypt allows 5
      # duplicate certificates per hostname per rolling week (README "Verify",
      # blue-green.md "Let's Encrypt limits"), so keys are cheap to add now and
      # expensive to add on the day you need them. Declaring it now means every later
      # adjustment changes only the VALUE — the same reason ACME_STAGING is kept
      # permanently listed rather than added and removed.
      #
      # Currently: 0gm-1.0-35b-a3b, the 0G in-house model. ⚠️ Naming ANY model here
      # means every OTHER model stops being sealed — the list is exhaustive, not
      # additive. That is the intended shape (sealing a model with no sealable
      # provider fails it outright), but it does mean a second E2EE-capable model
      # has to be added here explicitly before it is sealed again.
      #
      # Its only registry alias is the on-chain spelling 0GM-1.0-35B-A3B, a pure
      # case variant, and matching is case-insensitive — so the one entry covers
      # both. Matching is also EXACT, so the separate canonical model
      # 0gm-1.0-35b-a3b-sia is deliberately NOT included; add it by name if it
      # gains E2EE support.
      - "ZG_GATEWAY_SEAL_MODELS=${ZG_GATEWAY_SEAL_MODELS:-0gm-1.0-35b-a3b}"
      # ZG_GATEWAY_UNSEALED_SUBTREE decides what a sealed surface's sub-resources and
      # non-sealed methods answer: "refuse" (501, the default — right while a caller
      # who wants the router's own handling can call the router directly) or
      # "passthrough" (forward them, marked X-0G-E2EE: none — right once this gateway
      # IS the only entry, where a 501 removes the feature rather than redirecting).
      # An unrecognised value fails startup instead of guessing: one of the two answers
      # forwards content in the clear, and that is not a thing to infer from a typo.
      # Inert while ZG_GATEWAY_SEAL_POLICY=off — with nothing sealed there is no
      # sealed namespace left to decide about, and the gateway logs a warning if the
      # two are set in a combination that reads as if there were.
      #
      # THE DEFAULT STAYS "refuse", AND THE GLOBAL-ENTRY DEPLOYMENT OVERRIDES IT.
      # Which answer is correct is a property of the TOPOLOGY, not of the build, and
      # the two topologies are live at the same time during the migration: a gateway
      # on its own hostname beside the router is optional, and 501 points a caller at
      # the door they can still use; a gateway that has taken over the router's
      # hostname is the only door, and 501 removes POST /v1/messages/count_tokens and
      # GET /v1/chat/completions outright.
      #
      # So a deployment that has become the sole entry sets
      # ZG_GATEWAY_UNSEALED_SUBTREE=passthrough in its encrypted env (the key is
      # already declared here, so that is a value change and costs no compose_hash).
      # Shipping "passthrough" as the default instead would widen what reaches the
      # untrusted router in the clear on every deployment at its next redeploy,
      # ahead of any topology that needs it — the wrong direction to be early in.
      # Flip this default in the milestone that retires the last optional-entry
      # deployment, not before.
      - "ZG_GATEWAY_UNSEALED_SUBTREE=${ZG_GATEWAY_UNSEALED_SUBTREE:-refuse}"
      # There is deliberately NO variable for the catalog cache TTL
      # (-catalog-cache-ttl, default 10s), even though the flag exists for local runs
      # and the loadtest compose. Inside the CVM it would buy nothing: the measured
      # compose text is what fixes app_id, so changing this value here is a redeploy
      # either way — the variable would only add an allowed_envs entry that has to be
      # carried on EVERY blue/green side, for a knob that can never be turned without
      # a redeploy anyway. Add one the day a value here can actually be changed
      # without one.
      # DCAP-verify each provider's TDX quote and seal only to the verified enc key,
      # instead of trusting the router-supplied pubkey endpoint. Enforced per request:
      # a provider that fails is rejected.
      - "ZG_GATEWAY_ATTEST=true"
      # Reject a provider whose measurement is not in the allowlist instead of only
      # warning. ON, so hop 3 is a gate rather than an observation: a provider whose
      # MRTD/RTMR1/RTMR2 is not one of the listed images is refused before anything is
      # sealed to it, and the request falls back to the next candidate — with a single
      # provider registered there is no next candidate, so it fails.
      #
      # The allowlist is the embedded client/evidence/brokerimages.json, so it travels
      # with the BUILD, not with this file: the startup log line names the entries the
      # running image carries, and it is the line to read after a deploy, because an
      # enforcing gateway on a build carrying the wrong entries refuses the whole fleet.
      # Turning it on is only safe while every provider being routed to is on a listed
      # image — check before each rollout, not once: a provider that moves to a NEW
      # guest-OS release is refused until an entry for that release is computed and
      # shipped in a new gateway build (README, "When a PROVIDER upgrades its broker").
      # To ride out a fleet that has drifted, set this back to false and redeploy; the
      # verification stays, only the verdict softens.
      #
      # One monitoring consequence: zg_gateway_quote_measurement_untrusted_total stops
      # counting under enforce — an unlisted image never reaches the warn path, it
      # becomes a quote-verification failure instead. Watch
      # quote_verifications_total{result="error"} and warmer_ready_providers for the
      # refusals now, not that counter.
      - "ZG_GATEWAY_ATTEST_ENFORCE=true"
      # Cross-check each provider's quote-bound TEE signer against its acknowledged
      # on-chain teeSignerAddress. The RPC + contract default to 0G mainnet, so they
      # stay implicit; override BOTH together for testnet or your own node.
      - "ZG_GATEWAY_ONCHAIN=true"
      # - "ZG_GATEWAY_CHAIN_RPC_URL=https://evmrpc.0g.ai"
      # - "ZG_GATEWAY_SERVING_CONTRACT=0x47340d900bdFec2BD393c626E12ea0656F938d84"
      # Skip a provider whose on-chain signer is missing/unacknowledged/mismatched
      # instead of only warning. ON, so hop 5 is a gate: a provider the registry does not
      # vouch for is refused before anything is sealed to it, and the request falls back
      # to the next candidate — so this needs a fleet with a candidate to spare.
      #
      # A signer that could not be READ at all also fails closed, with no knob to relax
      # it. README "Notes" has the rest: what to watch before and after a rollout, and
      # why a mismatch is read together with the log line beside it.
      - "ZG_GATEWAY_ONCHAIN_ENFORCE=true"
      # Verify each response's §8 TEE signature (trust-chain hop 11) fail-closed
      # against the quote-bound signer. A response that does not verify is rejected.
      - "ZG_GATEWAY_VERIFY_RESPONSES=true"
      # Fetch Intel PCS collateral from Phala's hosted PCCS instead of Intel's
      # (closest source on this infrastructure; Intel PCS is historically flaky).
      # Only the host is swapped — collateral stays Intel-signed and its validity
      # window is checked, so a hostile mirror can neither forge nor serve expired
      # collateral, and withholding it fails closed. It CAN serve
      # older-but-still-valid CRL / TCB Info, delaying an observed revocation by up
      # to its nextUpdate: a bounded freshness delegation, not a free one.
      - "ZG_GATEWAY_PCCS_URL=https://pccs.phala.network"
      # How long DCAP collateral is memoized by URL. Bounds revocation lag; defaults
      # to 1h, 0 disables.
      # - "ZG_GATEWAY_COLLATERAL_TTL=1h"
      # Background warmer: pre-verify every provider's quote ahead of expiry so
      # requests hit a warm cache instead of paying the DCAP verify inline. Requires
      # ZG_GATEWAY_ATTEST *and* ZG_GATEWAY_ONCHAIN — both on above; enabling it with
      # ONCHAIN off exits(1) into a restart loop behind a healthy ingress. Interval
      # left at its 4m default, under the ~5m quote-cache TTL.
      - "ZG_GATEWAY_WARM=true"
      # - "ZG_GATEWAY_WARM_INTERVAL=4m" # optional; 4m is already the default
      #
      # Soft limit for the Go runtime, and the input the sealed path's in-flight cap
      # is derived from — ZG_GATEWAY_MAX_INFLIGHT is deliberately unset, so the number
      # has one source:
      #
      #   24 GiB / 2 (bodies' share) / ~30 MiB (peak per request) = ~409 in flight
      #
      # ASSUMES a 32 GiB CVM, which nothing here can check, so it must be re-derived
      # by hand on resize. Where 24 comes from, why this is not a substitute for the
      # cap, and how a wrong value stays quiet: README "CVM shape — and the one
      # setting that depends on it".
      - "GOMEMLIMIT=24GiB"
      # Read this CVM's identity from the file cvm-identity wrote, NOT the
      # guest-agent socket. The empty ZG_GATEWAY_DSTACK_SOCKET is load-bearing: unset
      # it and the binary's default would reinstate the socket path as a fallback,
      # giving the prompt-handling container a privileged runtime surface back.
      - "ZG_GATEWAY_IDENTITY_FILE=/run/identity/identity.json"
      - "ZG_GATEWAY_DSTACK_SOCKET="
      # The /evidences/ route EVIDENCE_SERVER=false handed over, served out of the
      # ingress's volume with Access-Control-Allow-Origin: *. That wildcard is
      # independent of ZG_GATEWAY_ALLOWED_ORIGINS above and must stay that way: that
      # list governs who may drive SEALED INFERENCE through the enclave, while this
      # is static public data any `curl` already fetches. Empty unmounts the route.
      - "ZG_GATEWAY_EVIDENCE_DIR=/evidences"
      # This CVM's self-description at /v1/gateway/identity (issue #78), for a
      # browser panel to SHOW what it is connected to. A DESCRIPTION, not evidence —
      # nothing in it is signed, and every value is rederivable with `pcverify
      # -gateway <DOMAIN>`, which also does the step a browser cannot do at all:
      # comparing the served TLS certificate against the one the quote binds. On by
      # default — it publishes nothing that /evidences/ and the release assets do
      # not already make public — so uncomment only to remove the route entirely. Read
      # the header of client/cmd/gateway/identity.go before extending what it
      # reports.
      # - "ZG_GATEWAY_IDENTITY_ENDPOINT=false"
      #
      # Where that container list comes from: the manifest cvm-identity wrote to the
      # shared volume. Set here rather than defaulted in the binary because this path
      # is a CONTRACT BETWEEN CONTAINERS — it appears three times in this file (the
      # -out-app-compose argument, the `identity` volume, this line) and splitting it
      # between YAML and Go is how a renamed volume turns into a silently empty
      # container list.
      - "ZG_GATEWAY_APP_COMPOSE_FILE=/run/identity/app-compose.json"
      # Fallback for the one case the file cannot cover: a replica whose init
      # container predates -out-app-compose, which is exactly what a rolling
      # blue/green upgrade looks like mid-flight. Only consulted when the file is
      # unreadable. This wants the BASE domain, which is exactly what the platform
      # exports — so read it straight rather than re-deriving it from the ingress's
      # `_.`-prefixed form; the two then cannot disagree. This side is also the
      # forgiving one: appIDHost strips a leading "_." if it ever sees one, so only
      # the ingress line above is sensitive to the platform's spelling.
      - "ZG_GATEWAY_PLATFORM_BASE_DOMAIN=${DSTACK_GATEWAY_DOMAIN:-}"
      # How many published releases the deployed compose text is compared against,
      # byte-for-byte, for matched_release — the same lookup pcverify makes, so the
      # release this panel NAMES and the one pcverify CONFIRMS cannot disagree. Left
      # at 5, pcverify's default too; runs once per boot, not per request. Uncomment
      # to disable the lookup — for a CVM with no egress to GitHub, which then
      # reports matched_release: null.
      # - "ZG_GATEWAY_IDENTITY_RELEASES=0"
      #
      # The PROVIDER half of the same panel, at /v1/providers/{address}/identity
      # (issue #80): what this gateway verified about each provider it sealed to.
      # Unlike the self-description it DOES report verdicts — but RELAYED ones, which
      # a panel must render as "the gateway verified this for you". Requires
      # ZG_GATEWAY_ATTEST (on above), or the route is not mounted. On by default;
      # uncomment to remove it. See client/cmd/gateway/provideridentity.go.
      # - "ZG_GATEWAY_PROVIDER_IDENTITY_ENDPOINT=false"
    volumes:
      # Identity in, read-only, as a plain JSON file — deliberately not the
      # guest-agent socket, which also derives keys and issues quotes.
      - identity:/run/identity:ro
      # The evidence bundle, READ-ONLY: this container publishes it and must never be
      # able to rewrite what dstack-ingress attested to. Files are read per request,
      # so a certificate renewal is picked up with no restart.
      - evidences:/evidences:ro
    # The gateway itself holds no secret: no pinned provider key, and no TLS material
    # — the cert and its key belong to dstack-ingress above.

  # Scrapes the gateway's internal /metrics over the CVM docker network and
  # remote_writes to a central store. AGENT MODE (--enable-feature=agent): no local
  # TSDB, no query API — this CVM is ephemeral, the durable copy lives in the remote
  # store. Neither `ports:` nor `expose:`, so it is reachable only from within the
  # compose network.
  prometheus-agent:
    # The multi-arch INDEX digest, not a per-arch manifest digest — both look equally
    # valid. `docker buildx imagetools inspect prom/prometheus:<tag>` prints it.
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/agent.yml"
      - "--enable-feature=agent"
    configs:
      # Compose mounts this 0444, so the agent (uid 65534/nobody) can read it.
      - source: prom_agent_config
        target: /etc/prometheus/agent.yml
    volumes:
      - identity:/run/identity:ro
    # Load-bearing, not just tidy: both jobs discover their targets from the file_sd
    # documents cvm-identity writes, so until those exist this agent scrapes nothing.
    depends_on:
      cvm-identity:
        condition: service_completed_successfully

volumes:
  cert-data: # SECRET: holds the TLS private key and the ACME account key
  evidences: # public evidence bundle: written by dstack-ingress, served at /evidences/ by the gateway
  identity: # this CVM's instance_id/app_id, written once by cvm-identity, read-only everywhere else

configs:
  # agent.yml, rendered by COMPOSE (not Prometheus, which does not expand env vars in
  # its own config): the ${…} refs are interpolated from the deploy env at parse time,
  # so the measured compose text holds only the references, never the values. All
  # three vars must be listed in the app's allowed_envs or dstack drops them.
  prom_agent_config:
    content: |
      global:
        scrape_interval: 15s
        external_labels:
          # Stamped on every series pushed, so a shared store can tell this
          # gateway apart from other services (service) and this deployment's
          # environment from the other (env). These CANNOT separate replicas —
          # two CVMs of one app_id run this exact config — which is what the
          # per-job file_sd target labels below are for.
          service: 0g-pc-gateway
          env: "${ZG_PROM_ENV:?set staging or mainnet}"
      scrape_configs:
        # Both jobs take their per-replica identity as TARGET labels from the
        # documents cvm-identity wrote; nothing is labelled exporter-side.
        # Prometheus synthesises `up` and the scrape_* series from target labels
        # alone, so a label the exporter stamps on its own series cannot reach
        # them — static_configs here would leave all five byte-identical between
        # two replicas, colliding on the signal most worth alerting on.
        - job_name: gateway
          file_sd_configs:
            - files: ["/run/identity/sd/gateway.json"]
        # The agent's own series — remote_write queue depth, send failures: the
        # signal that tells you a replica has gone deaf.
        - job_name: prometheus-agent
          file_sd_configs:
            - files: ["/run/identity/sd/prom-agent.json"]
      remote_write:
        - url: "${ZG_PROM_REMOTE_WRITE_URL:?set the remote_write endpoint, e.g. https://prometheus.example.com/api/v1/write}"
          basic_auth:
            username: "${ZG_PROM_REMOTE_WRITE_USERNAME:?set the remote_write basic_auth username}"
            password: "${ZG_PROM_REMOTE_WRITE_PASSWORD:?set the remote_write basic_auth password}"
