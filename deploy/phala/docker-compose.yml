# Phala Cloud (dstack) deployment for the 0G-PC cloud-TEE gateway.
#
# This runs the `gateway` — the SAME client core as the sidecar, but server-run
# and 0G-operated, meant to run inside an attested CVM (see
# docs/design/cloud-gateway.md §5.3/§6) — on OUR OWN domain, behind dstack-ingress.
#
# dstack-ingress terminates TLS *inside this CVM* (the key is generated in the
# enclave and never leaves it) and forwards plaintext to the gateway over the
# compose network, so the gateway itself must NOT do TLS. Both containers
# therefore have to live in this one compose / one CVM.
#
# What the attestation actually gives you (cloud-gateway.md §6.1):
# dstack-ingress serves /evidences/ — acme-account.json, cert-<DOMAIN>.pem,
# sha256sum.txt and quote.json — where
#   report_data holds SHA-256(sha256sum.txt) (right-padded to 64 bytes), and
#     sha256sum.txt covers the served certificate
#   the quote's RTMR chain commits to app_id, the hash of the app-compose
#     manifest — which embeds THIS file verbatim — recovered by replaying the
#     event log against the verified quote, and therefore covering BOTH
#     containers below
# So the quote proves "a CVM running exactly this app-compose obtained this
# certificate inside the TEE". Concluding that the endpoint you are *talking to*
# is that CVM needs one more step the quote cannot do for you: handshake with
# <DOMAIN> and check the served cert equals cert-<DOMAIN>.pem in the bundle. The
# CAA record dstack-ingress publishes (pinned to its own ACME account) stops a
# THIRD PARTY obtaining a different cert for the name; it does not constrain
# whoever holds the DNS token, which is why the comparison above is the check
# that matters.
#
# This is why the gateway needs no quote of its own: app_id already attests its
# image, so the gateway exposes no attestation endpoint and signs no responses of
# its own (inference authenticity rides each provider's SPEC §8 signature).
#
# Deploy: reference this compose file from the Phala Cloud dashboard, or via the
# Phala CLI, with the environment and DNS records in README "Serving domain".

services:
  dstack-ingress:
    # Official upstream image, v2.3 — the first release with the DNS-01
    # DELEGATION_ZONE feature (Dstack-TEE/dstack-examples #104/#108). Public on
    # Docker Hub; pinned by digest so app_id commits to this exact image.
    image: dstacktee/dstack-ingress:2.3@sha256:527c53523b9226782a11dbd800a3ff55e8a1f0b88e6224e8f7e4db7419769fbe
    restart: unless-stopped
    # Start after the gateway is HEALTHY, not merely created: HAProxy resolves the
    # `gateway` backend name once at startup (see the gateway's expose note), so
    # bringing it up before the gateway serves risks a dead backend on first boot.
    # This closes the startup race only — it does NOT cover the gateway being
    # recreated with a new address later; that still needs an ingress restart (see
    # the gateway note). depends_on is part of the measured compose text (app_id).
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      # Publishes 443 on the CVM so the dstack gateway can reach HAProxy in here.
      # The gateway passes any SNI it holds no wildcard cert for straight through
      # at L4 and takes the target from the `_dstack-app-address` TXT record
      # (`<app_id>:<port>`, port 443 by default), so TLS is never terminated
      # outside this CVM. NOTE: the platform host's own front end forwards only
      # SNI suffixes it has been configured for — a new domain suffix has to be
      # allowlisted by Phala first, see README "Serving domain".
      - "443:443"
    environment:
      - DNS_PROVIDER=cloudflare
      # `:?` on purpose: an unset var must fail the deploy loudly. An empty
      # DELEGATION_ZONE in particular is not a no-op — it switches the container
      # out of delegation mode, at which point it tries to write records into the
      # SERVED domain's own zone with a token that has no access there.
      - DOMAIN=${DOMAIN:?set DOMAIN, e.g. pc-gateway.example.com}
      - GATEWAY_DOMAIN=${GATEWAY_DOMAIN:?set GATEWAY_DOMAIN, e.g. _.<cluster>.phala.network}
      - DELEGATION_ZONE=${DELEGATION_ZONE:?set DELEGATION_ZONE, the zone this container may write}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:?set CLOUDFLARE_API_TOKEN, scoped to DELEGATION_ZONE only}
      - TARGET_ENDPOINT=gateway:8443 # forward decrypted traffic to the gateway
      # Least privilege: the container manages every record it needs INSIDE the
      # delegation zone (our token controls it), so the token needs NO access to
      # the served domain's own zone. The operator creates three static CNAMEs in
      # the served zone ONCE, before the first boot, all pointing into the
      # delegation zone — and never touches DNS again, not even when the app id
      # changes:
      #   pc-gateway.example.com                     CNAME  pc-gateway.example.com.<DELEGATION_ZONE>
      #   _dstack-app-address.pc-gateway.example.com CNAME  _dstack-app-address.pc-gateway.example.com.<DELEGATION_ZONE>
      #   _acme-challenge.pc-gateway.example.com     CNAME  _acme-challenge.pc-gateway.example.com.<DELEGATION_ZONE>
      # Two variables are deliberately NOT declared here, because a var absent
      # from this block is NOT passed to the container — setting it in the CVM's
      # environment would silently do nothing. Uncommenting either edits this
      # file, which changes app_id: a different, separately auditable deployment.
      #
      # ACME_EMAIL is optional and PUBLISHED — the ACME account document is part
      # of the evidence bundle, so any address here is world-readable at
      # https://<DOMAIN>/evidences/acme-account.json. Leave it out unless a
      # contact on the ACME account is actually wanted.
      # - ACME_EMAIL=${ACME_EMAIL:-}
      #
      # ACME_STAGING is off, so this deployment issues real, publicly trusted
      # certs. Add the line below (not an env var) to bring up a NEW hostname
      # against the staging CA first — see README "Deploy".
      # - ACME_STAGING=true
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock # in-enclave attestation + cert binding
      - cert-data:/etc/letsencrypt
      - evidences:/evidences

  gateway:
    # Published by .github/workflows/docker.yml to GHCR.
    #
    # DEVELOPMENT: floating `:latest` so a fresh build is picked up on redeploy
    # without editing this file. This DEFEATS the attestation story and MUST be
    # re-pinned before any attested / production deploy: app_id hashes the
    # app-compose manifest, which embeds this file verbatim, so a floating tag
    # keeps app_id — and therefore the quote — identical while the code that sees
    # plaintext user prompts changes underneath it. Restore the digest pin
    # (`ghcr.io/0gfoundation/0g-pc-e2ee-gateway@sha256:<digest>`) and re-pin it
    # deliberately on every upgrade; see README "Pin the image digest".
    image: ghcr.io/0gfoundation/0g-pc-e2ee-gateway:latest
    restart: unless-stopped
    # Deliberately NOT published to the host: a published 8443 would also be
    # served at `<app-id>-8443.<base_domain>`, where the dstack gateway (not this
    # CVM) terminates TLS — the same requests, but outside our own enclave and
    # under a cert with no binding to this app. dstack-ingress reaches the
    # gateway over the compose network instead.
    #
    # HAProxy resolves `gateway` once at startup, so if this container is ever
    # recreated with a new address, restart dstack-ingress too.
    expose:
      - "8443"
      - "9464" # internal Prometheus /metrics (see ZG_GATEWAY_METRICS_LISTEN below)
    # The gateway serves GET /healthz ("ok"); the image is distroless (no shell,
    # no curl), so the probe is the gateway binary itself — `gateway -health`
    # does one GET /healthz to its own ZG_GATEWAY_LISTEN port and exits 0/1. This
    # is what lets dstack-ingress gate on `condition: service_healthy` below, so
    # it does not resolve/forward to the gateway until the gateway is actually
    # serving. Part of the measured compose text (app_id).
    healthcheck:
      test: ["CMD", "/usr/local/bin/gateway", "-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      # Grace before failures count: the gateway must parse config, dial the
      # router, and (with -warm) prime the quote cache before it is "up".
      start_period: 30s
    # Same env-var contract as the sidecar (flag > env var > default). This block
    # is part of the compose text app_id commits to.
    environment:
      # Same as the binary's own default (`:8443`), stated explicitly because this
      # block is measured: the address dstack-ingress forwards to should be
      # readable here rather than implied. It must stay all-interfaces — a
      # localhost bind (as the sidecar uses) would be unreachable across the
      # compose network.
      - "ZG_GATEWAY_LISTEN=0.0.0.0:8443"
      # Serve Prometheus /metrics on a SEPARATE internal listener. Like the gateway
      # itself this port is never published to the host and dstack-ingress does not
      # front it, so it is reachable only over the compose network — by a co-located
      # Prometheus-agent scraper (added separately, which scrapes `gateway:9464`).
      # Binding 0.0.0.0 is what lets that scraper reach it across the compose network
      # (a localhost bind would be container-local). Empty/unset disables the
      # endpoint entirely; the sidecar binary leaves it unset.
      - "ZG_GATEWAY_METRICS_LISTEN=0.0.0.0:9464"
      # The gateway routes per request and derives each provider's enc key +
      # signer from the broker, so no provider/key is configured up front. The
      # router base URL is deploy-time injectable so staging and prod can share
      # this file: the value below is the measured text, but the ${...} form lets
      # an encrypted-env override win at boot. Unset (prod) → the 0G production
      # router; set ZG_GATEWAY_ROUTER_URL in the CVM's encrypted environment
      # (staging) → that URL. The interpolation happens INSIDE the CVM, so the
      # variable must also be listed in the app's allowed_envs — dstack drops any
      # encrypted var that is not, surfacing only as a boot-time interpolation
      # error. Because the measured text is the ${...} form (identical for both),
      # staging and prod share app_id: attestation does NOT distinguish which
      # router was used. That is acceptable here only because the router is
      # untrusted by construction — every provider is verified by TDX quote and
      # on-chain signer (ATTEST/ONCHAIN below), so a swapped router cannot forge a
      # provider; the blast radius is routing/availability, not confidentiality.
      - "ZG_GATEWAY_ROUTER_URL=${ZG_GATEWAY_ROUTER_URL:-https://router-api.0g.ai}"
      # Request fields sealed end-to-end to the provider (must include
      # "messages"). Defaults to the binary's built-in set; uncomment to override.
      # - "ZG_GATEWAY_SEAL_FIELDS=messages"
      # Cleartext fields excluded from the AAD (intermediary-mutable, untrusted);
      # an empty value binds everything. Defaults to the built-in set; uncomment
      # to override.
      # - "ZG_GATEWAY_UNBOUND_FIELDS="
      # DCAP-verify each provider's TDX quote and seal only to the verified enc
      # key, instead of trusting the router-supplied pubkey endpoint. Enabled
      # here: quote authenticity (genuine TDX, TCB up to date, report_data
      # binding) is enforced per request; a provider that fails it is rejected.
      - "ZG_GATEWAY_ATTEST=true"
      # With ZG_GATEWAY_ATTEST, reject a provider whose measurement is not in the
      # allowlist instead of only warning. The audited-image allowlist is not
      # wired yet (empty), so enforce currently rejects ALL providers — leave it
      # off until the allowlist lands, so ATTEST runs in verify-and-warn mode.
      # - "ZG_GATEWAY_ATTEST_ENFORCE=true"
      # Cross-check each provider's quote-bound TEE signer against its acknowledged
      # on-chain teeSignerAddress (InferenceServing registry). Requires
      # ZG_GATEWAY_ATTEST. Enabled here. The RPC + contract default to 0G mainnet
      # (evmrpc.0g.ai / 0x47340d900bdFec2BD393c626E12ea0656F938d84), so they stay
      # implicit; uncomment and override BOTH together for testnet or your own node.
      - "ZG_GATEWAY_ONCHAIN=true"
      # - "ZG_GATEWAY_CHAIN_RPC_URL=https://evmrpc.0g.ai"
      # - "ZG_GATEWAY_SERVING_CONTRACT=0x47340d900bdFec2BD393c626E12ea0656F938d84"
      # With ZG_GATEWAY_ONCHAIN, skip a provider whose on-chain signer is
      # missing/unacknowledged/mismatched instead of only warning. Left OFF: ONCHAIN
      # runs in verify-and-warn mode, so a provider with incomplete on-chain data is
      # logged but still served. Flip to true to reject those providers outright.
      # - "ZG_GATEWAY_ONCHAIN_ENFORCE=true"
      # Verify each response's §8 TEE signature (trust-chain hop 11): fetch the
      # signature straight from the provider's broker and check it fail-closed
      # against the quote-bound signer, which ZG_GATEWAY_ONCHAIN additionally
      # grounds on chain. Requires ZG_GATEWAY_ATTEST. Enabled here, so a response
      # whose signature does not verify is rejected rather than returned.
      - "ZG_GATEWAY_VERIFY_RESPONSES=true"
      # Fetch Intel PCS collateral (TCB Info, QE Identity, PCK CRL) from Phala's
      # hosted PCCS instead of api.trustedservices.intel.com. This CVM runs on
      # Phala infrastructure, so its own PCCS is the closest, most reliable source
      # (Intel PCS is reachable but historically rate-limited/flaky). Only the host
      # is swapped: collateral stays Intel-signed wherever it is served, and
      # verification checks its validity window, so a hostile mirror can neither
      # forge collateral nor serve expired collateral, and withholding it fails
      # closed. What it CAN do is serve older-but-still-valid CRL / TCB Info,
      # delaying an observed revocation or TCB downgrade by up to its nextUpdate —
      # a bounded freshness delegation, not a free one. The SGX root-CA CRL still
      # comes from Intel (a different host). Requires ZG_GATEWAY_ATTEST.
      - "ZG_GATEWAY_PCCS_URL=https://pccs.phala.network"
      # How long DCAP collateral is memoized by URL, so it is not re-fetched for
      # every provider and every warmer sweep. Bounds revocation lag (a cached CRL
      # delays seeing a fresh revocation until it expires); defaults to 1h, set 0
      # to disable. Uncomment to override.
      # - "ZG_GATEWAY_COLLATERAL_TTL=1h"
      # Run a background warmer that pre-verifies every provider's quote and
      # refreshes it ahead of expiry, so requests hit a warm cache instead of
      # paying the DCAP verify (quote fetch + collateral) inline. Requires
      # ZG_GATEWAY_ATTEST and ZG_GATEWAY_ONCHAIN (the endpoint is resolved on
      # chain) — both are on above, so this starts cleanly; enabling it while
      # ZG_GATEWAY_ONCHAIN was off would exit(1) into a restart loop, with the
      # ingress up and healthy in front of it. Enabled here. The interval is left
      # implicit at its 4m default, under the ~5m quote-cache TTL.
      - "ZG_GATEWAY_WARM=true"
      # - "ZG_GATEWAY_WARM_INTERVAL=4m" # optional; 4m is already the default
    # The gateway itself holds no secret: no pinned provider key, and no TLS
    # material — the cert and its key belong to dstack-ingress above, generated
    # in-enclave via ACME and kept in the cert-data volume.
    #
    # The gateway serves Prometheus /metrics on the internal 9464 above; a
    # co-located Prometheus-agent sidecar that scrapes it and remote_writes to a
    # central store is added separately (it depends only on this exposed port).

volumes:
  cert-data: # SECRET: holds the TLS private key and the ACME account key
  evidences: # public evidence bundle served at /evidences/
