# Phala Cloud (dstack) deployment for the 0G-PC cloud-TEE gateway.
#
# This runs the `gateway` — the SAME client core as the sidecar, but server-run
# and 0G-operated, meant to run inside an attested CVM (see
# docs/design/cloud-gateway.md §7). dstack's ZT-HTTPS front end terminates TLS
# *inside the enclave* and forwards plaintext to the container, so the gateway
# listens on a plain HTTP socket here — it must NOT do TLS itself.
#
# dstack/tproxy ingress maps container ports to a public HTTPS URL:
#   https://<app-id>-8443.<base_domain>   ->  port 8443 in this CVM
# (the `<app-id>.<base_domain>` form maps to 80/443; the `-<port>` form maps to
# that port. A trailing `s` — `<app-id>-8443s.<base_domain>` — would forward
# encrypted TCP for an app that terminates TLS itself; we don't, dstack does.)
#
# Deploy: reference this compose file from the Phala Cloud dashboard, or via the
# Phala CLI (`phala cvm create --compose deploy/phala/docker-compose.yml`).

services:
  gateway:
    # Published by .github/workflows/docker.yml to GHCR.
    #
    # NOTE: in a TEE the compose file is *measured* into the CVM's attestation,
    # so a floating tag makes the measurement change unpredictably. For a
    # reproducible deployment, pin to an immutable digest instead of `:latest`,
    # e.g.:
    #   image: ghcr.io/0gfoundation/0g-pc-e2ee-gateway@sha256:<digest>
    image: ghcr.io/0gfoundation/0g-pc-e2ee-gateway:latest
    restart: unless-stopped
    ports:
      # host:container — dstack tproxy forwards the public ingress to the host
      # side, so this port is what appears as `<app-id>-8443.<base_domain>`.
      - "8443:8443"
    # Every startup parameter also reads from a ZG_GATEWAY_* environment
    # variable (precedence: command-line flag > env var > built-in default), so
    # it can be set here in the measured `environment:` block instead of via
    # `command:`. This block is what dstack measures into the CVM attestation.
    environment:
      # Bind to all interfaces (the binary defaults to localhost, which would be
      # container-local only) so dstack can forward to it.
      - "ZG_GATEWAY_LISTEN=0.0.0.0:8443"
      # Serve Prometheus /metrics on a SEPARATE internal listener. Note this port
      # is deliberately NOT in the `ports:` block above, so dstack tproxy never
      # maps it to a public URL — it is reachable only over the CVM-internal docker
      # network, i.e. by the prometheus-agent sidecar below (which scrapes
      # `gateway:9464`). Binding 0.0.0.0 is what lets that co-located container
      # reach it; publishing is what would make it public, and we don't publish it.
      # Empty/unset disables the endpoint entirely.
      - "ZG_GATEWAY_METRICS_LISTEN=0.0.0.0:9464"
      # The gateway routes per request and derives each provider's enc key +
      # signer from the broker, so no provider/key is configured up front. It
      # defaults to the 0G router; uncomment to override.
      # - "ZG_GATEWAY_ROUTER_URL=https://router-api.0g.ai"
      # Request fields sealed end-to-end to the provider (must include
      # "messages"). Defaults to the binary's built-in set; uncomment to override.
      # - "ZG_GATEWAY_SEAL_FIELDS=messages"
      # Cleartext fields excluded from the AAD (intermediary-mutable, untrusted);
      # an empty value binds everything. Defaults to the built-in set; uncomment
      # to override.
      # - "ZG_GATEWAY_UNBOUND_FIELDS="
      # DCAP-verify each provider's TDX quote and seal only to the verified enc
      # key, instead of trusting the router-supplied pubkey endpoint. Enabled
      # here: quote authenticity (genuine TDX, TCB up to date, report_data
      # binding) is enforced per request; a provider that fails it is rejected.
      - "ZG_GATEWAY_ATTEST=true"
      # With ZG_GATEWAY_ATTEST, reject a provider whose measurement is not in the
      # allowlist instead of only warning. The audited-image allowlist is not
      # wired yet (empty), so enforce currently rejects ALL providers — leave it
      # off until the allowlist lands, so ATTEST runs in verify-and-warn mode.
      # - "ZG_GATEWAY_ATTEST_ENFORCE=true"
      # Cross-check each provider's quote-bound TEE signer against its acknowledged
      # on-chain teeSignerAddress (InferenceServing registry). Requires
      # ZG_GATEWAY_ATTEST. Defaults to off. The RPC + contract default to 0G
      # mainnet; override both together for testnet or your own node.
      # - "ZG_GATEWAY_ONCHAIN=true"
      # - "ZG_GATEWAY_CHAIN_RPC_URL=https://evmrpc.0g.ai"
      # - "ZG_GATEWAY_SERVING_CONTRACT=0x47340d900bdFec2BD393c626E12ea0656F938d84"
      # With ZG_GATEWAY_ONCHAIN, skip a provider whose on-chain signer is
      # missing/unacknowledged/mismatched instead of only warning. Defaults to off.
      # - "ZG_GATEWAY_ONCHAIN_ENFORCE=true"
      # Fetch Intel PCS collateral (TCB Info, QE Identity, PCK CRL) from Phala's
      # hosted PCCS instead of api.trustedservices.intel.com. This CVM runs on
      # Phala infrastructure, so its own PCCS is the closest, most reliable source
      # (Intel PCS is reachable but historically rate-limited/flaky). Only the host
      # is swapped and collateral is Intel-signed regardless of where it is served,
      # so this is a transport choice, not a trust one; the SGX root-CA CRL still
      # comes from Intel (a different host). Requires ZG_GATEWAY_ATTEST.
      - "ZG_GATEWAY_PCCS_URL=https://pccs.phala.network"
      # How long DCAP collateral is memoized by URL, so it is not re-fetched for
      # every provider and every warmer sweep. Bounds revocation lag (a cached CRL
      # delays seeing a fresh revocation until it expires); defaults to 1h, set 0
      # to disable. Uncomment to override.
      # - "ZG_GATEWAY_COLLATERAL_TTL=1h"
      # Run a background warmer that pre-verifies every provider's quote and
      # refreshes it ahead of expiry, so requests hit a warm cache instead of
      # paying the DCAP verify (quote fetch + collateral) inline. Requires
      # ZG_GATEWAY_ATTEST and ZG_GATEWAY_ONCHAIN (the endpoint is resolved on
      # chain). Defaults to off; the interval defaults to 4m (under the ~5m
      # quote-cache TTL). Uncomment both to enable.
      # - "ZG_GATEWAY_WARM=true"
      # - "ZG_GATEWAY_WARM_INTERVAL=4m"
    # No secrets or volumes: the gateway holds no pinned provider key, and TLS
    # material is managed by dstack-kms inside the enclave, never by this file.

  # prometheus-agent scrapes the gateway's internal /metrics over the CVM docker
  # network and remote_writes the samples to the central store (the same pattern
  # other 0G services use: a co-located Prometheus that scrapes locally and pushes
  # out). It runs in AGENT MODE (--enable-feature=agent): no local TSDB, no query
  # API — this CVM is ephemeral, the durable copy lives in the remote store — it
  # only scrapes and forwards. It exposes no public port (nothing in `ports:`), so
  # like the metrics endpoint it is CVM-internal only.
  prometheus-agent:
    # Same image the other deployments pin; prefer an immutable digest here too so
    # the measured compose does not drift (see the gateway image note above).
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/agent.yml"
      - "--enable-feature=agent"
    volumes:
      - prom-agent-config:/etc/prometheus
    depends_on:
      # The config-init below materializes agent.yml (with the remote_write
      # credentials) into the shared volume before the agent starts.
      prom-config-init:
        condition: service_completed_successfully

  # prom-config-init writes the agent config into the shared volume from a
  # base64-encoded blob. The config carries the remote_write endpoint and its
  # basic_auth password, so the blob is a SECRET: it must be injected via dstack's
  # encrypted-secrets / KMS mechanism, NOT pasted into this measured compose in
  # cleartext (the `environment:` block here is measured into the CVM attestation
  # and is readable by anyone who can read the compose). Populate
  # ZG_PROM_AGENT_CONFIG_B64 from a dstack secret at deploy time.
  #
  # The decoded agent.yml should look like (targets use docker service names on the
  # CVM network; the gateway target is the internal metrics port above, and the
  # agent self-scrapes so remote_write health — queue length, failures — is visible
  # even though the CVM has no local query API):
  #
  #   global:
  #     scrape_interval: 15s
  #     external_labels: { service: "0g-pc-gateway" }
  #   scrape_configs:
  #     - job_name: "gateway"
  #       static_configs:
  #         - targets: ["gateway:9464"]
  #     - job_name: "prometheus-agent"          # self-scrape (remote_write health)
  #       static_configs:
  #         - targets: ["localhost:9090"]
  #   remote_write:
  #     - url: https://<your-prometheus>/api/v1/write
  #       basic_auth:
  #         username: "<user>"
  #         password: "<from dstack secret>"
  prom-config-init:
    image: alpine:3.20
    restart: "no"
    environment:
      # Injected from a dstack secret — see the note above. Never inline the
      # decoded config (or the password) into this measured file.
      - "ZG_PROM_AGENT_CONFIG_B64=${ZG_PROM_AGENT_CONFIG_B64}"
    volumes:
      - prom-agent-config:/etc/prometheus
    command:
      - "sh"
      - "-c"
      - 'echo "$${ZG_PROM_AGENT_CONFIG_B64}" | base64 -d > /etc/prometheus/agent.yml'

volumes:
  # Holds the agent config written by prom-config-init and read by the agent. No
  # TSDB volume is needed — agent mode keeps only a short write-ahead buffer.
  prom-agent-config:
