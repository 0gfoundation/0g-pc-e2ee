# Phala Cloud (dstack) deployment for the 0G-PC cloud-TEE gateway.
#
# Runs the `gateway` — the same client core as the sidecar, but server-run and
# 0G-operated — inside an attested CVM, behind dstack-ingress. dstack-ingress
# terminates TLS *inside this CVM* (the key is generated in the enclave and never
# leaves it) and forwards plaintext to the gateway over the compose network, so the
# gateway must NOT do TLS and the two have to share one compose / one CVM. Two more
# containers ride along: `cvm-identity`, a one-shot init container naming this
# replica, and `prometheus-agent`.
#
# EVERY byte below is measured into compose_hash (and so into app_id, its 20-byte
# prefix) — images, volumes, depends_on, env blocks. Editing this file, comments
# included, changes app_id.
#
# What the attestation proves, how to check it, and the rationale behind the
# settings here:
#   docs/design/cloud-gateway.md §5.3/§6  — design and trust model
#   docs/verifying-the-gateway.md         — how a user verifies a deployment
#   deploy/phala/README.md                — operator runbook, env, and Notes
#
# Deploy: reference this file from the Phala Cloud dashboard or the Phala CLI, with
# the environment and DNS records in README "Serving domain".

services:
  # Publishes THIS CVM's identity (instance_id / app_id) to the others, then exits.
  # An init container, not a service.
  #
  # Several CVMs can back one app_id (blue-green.md "Scaling one side"), and every
  # container here is byte-identical to its counterpart in the sibling replica, so
  # none can tell which one it is: the answer lives behind the guest-agent socket and
  # compose interpolation cannot see a value the runtime assigns per CVM. Doing the
  # lookup here is also what lets the GATEWAY drop that socket — the guest agent
  # derives keys and issues quotes, and this container touches it for one call and
  # exits, whereas the gateway runs for the life of the CVM handling user prompts.
  cvm-identity:
    # Keep this pin identical to the gateway's below: same image, one artifact — it
    # already contains this binary. The release workflow substitutes both lines with
    # one digest, so they cannot end up on different builds.
    image: ghcr.io/0gfoundation/0g-pc-e2ee-gateway:latest
    # `entrypoint:`, not `command:`: the image's ENTRYPOINT is the gateway and it
    # declares no CMD, so a `command:` would be appended to it rather than replace
    # it. Root, because the shared volume is created root-owned by docker and the
    # image's default user is `nonroot`.
    entrypoint: ["/usr/local/bin/cvmid"]
    user: "0:0"
    command:
      - "-out-identity"
      - "/run/identity/identity.json"
      # One file_sd document per scrape job — they must NOT share one, or each job
      # would discover the other's target. These carry the identity as TARGET
      # labels, the only mechanism that also reaches `up` and the other per-scrape
      # series (Prometheus builds those from target labels alone, never from the
      # exposition), which is why both jobs go through here.
      - "-prom-sd"
      - "/run/identity/sd/gateway.json=gateway:9464"
      - "-prom-sd"
      - "/run/identity/sd/prom-agent.json=localhost:9090"
    # Runs once. `unless-stopped` would restart it forever after each clean exit.
    restart: "no"
    volumes:
      # Held briefly — one call, then this container exits. dstack-ingress mounts the
      # same socket for the life of the CVM.
      - /var/run/dstack.sock:/var/run/dstack.sock
      - identity:/run/identity

  dstack-ingress:
    # Official upstream image. 2.3 is the floor: it is the first release with the
    # DNS-01 DELEGATION_ZONE feature (Dstack-TEE/dstack-examples #104/#108).
    image: dstacktee/dstack-ingress:2.3@sha256:527c53523b9226782a11dbd800a3ff55e8a1f0b88e6224e8f7e4db7419769fbe
    restart: unless-stopped
    # HEALTHY, not merely created: HAProxy resolves the `gateway` backend name once
    # at startup, so coming up before the gateway serves risks a dead backend on
    # first boot. This closes the startup race only — a gateway recreated with a new
    # address later still needs an ingress restart.
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      # Publishes 443 on the CVM so the dstack gateway can reach HAProxy in here. It
      # passes SNI it holds no wildcard cert for straight through at L4, taking the
      # target from the `_dstack-app-address` TXT record, so TLS is never terminated
      # outside this CVM. NOTE: the platform forwards only SNI suffixes it has been
      # configured for — a new domain suffix must be allowlisted by Phala first.
      - "443:443"
    environment:
      - DNS_PROVIDER=cloudflare
      # `:?` on purpose: an unset var must fail the deploy loudly. An empty
      # DELEGATION_ZONE in particular is not a no-op — it switches the container out
      # of delegation mode, at which point it tries to write records into the SERVED
      # domain's own zone with a token that has no access there.
      - DOMAIN=${DOMAIN:?set DOMAIN, e.g. pc-gateway.example.com}
      - GATEWAY_DOMAIN=${GATEWAY_DOMAIN:?set GATEWAY_DOMAIN, e.g. _.<cluster>.phala.network}
      - DELEGATION_ZONE=${DELEGATION_ZONE:?set DELEGATION_ZONE, the zone this container may write}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:?set CLOUDFLARE_API_TOKEN, scoped to DELEGATION_ZONE only}
      - TARGET_ENDPOINT=gateway:8443 # forward decrypted traffic to the gateway
      # Default `wait` blocks on boot until the served CNAMEs resolve to
      # `<name>.<DOMAIN>.<DELEGATION_ZONE>` — a strict one-hop match, correct for a
      # single instance. Blue/green (blue-green.md) runs each side under its own
      # sub-zone while the served CNAMEs stay pinned at the base zone, so the one-hop
      # pre-check never matches and a side would block: set DNS_SETUP_MODE=print
      # there, which skips only this container's pre-check (issuance and routing use
      # normal resolution, which follows the full chain). Keep DNS_SETUP_MODE listed
      # in allowed_envs permanently and toggle by VALUE — allowed_envs is itself
      # measured, so editing the list changes app_id.
      - DNS_SETUP_MODE=${DNS_SETUP_MODE:-wait}
      # Least privilege: the container manages every record it needs inside the
      # delegation zone, so the token needs NO access to the served domain's own
      # zone. The operator creates three static CNAMEs there once, before first boot
      # — see README "Serving domain" — and never touches DNS again, not even when
      # app_id changes.
      #
      # ACME_EMAIL is deliberately NOT declared: a var absent from this block is
      # never passed to the container, and this one is optional and PUBLISHED — the
      # ACME account document is part of the evidence bundle, so any address here is
      # world-readable at https://<DOMAIN>/evidences/acme-account.json.
      # - ACME_EMAIL=${ACME_EMAIL:-}
      #
      # Staging CA, defaulting to false = real, publicly-trusted certs. Set
      # ACME_STAGING=true in the encrypted env to bring up a NEW hostname first:
      # staging's rate limits are far higher than the 5-duplicate-certs-per-week
      # budget, and its certs are untrusted (smoke tests only). Toggle by value, not
      # by editing allowed_envs; a staging and a production run share app_id, and the
      # served cert's issuer is what distinguishes them.
      - ACME_STAGING=${ACME_STAGING:-false}
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock # in-enclave attestation + cert binding
      - cert-data:/etc/letsencrypt
      - evidences:/evidences

  gateway:
    # Published by .github/workflows/docker.yml to GHCR.
    #
    # DEVELOPMENT: floating `:latest` so a fresh build is picked up on redeploy
    # without editing this file. This DEFEATS the attestation story and MUST be
    # re-pinned before any attested / production deploy: compose_hash covers the
    # app-compose manifest, which embeds this file verbatim, so a floating tag keeps
    # compose_hash — and therefore app_id and the quote — identical while the code
    # that sees plaintext user prompts changes underneath it. Restore the digest pin
    # (`…-gateway@sha256:<digest>`) and re-pin deliberately on every upgrade; see
    # README "Pin the image digest".
    image: ghcr.io/0gfoundation/0g-pc-e2ee-gateway:latest
    restart: unless-stopped
    # Wait for the identity file, so the gateway's first log line already carries
    # instance_id — it reads the file ONCE at startup, so a race here costs the
    # dimension for the life of the process. cvm-identity exits 0 even when the guest
    # agent does not answer (writing no identity file), precisely so a telemetry
    # problem cannot hold the gateway down; it exits non-zero only if the volume is
    # not writable, which is a broken deploy.
    depends_on:
      cvm-identity:
        condition: service_completed_successfully
    # Deliberately NOT published to the host: a published 8443 would also be served
    # at `<app-id>-8443.<base_domain>`, where the dstack gateway — not this CVM —
    # terminates TLS, under a cert with no binding to this app. dstack-ingress
    # reaches the gateway over the compose network instead.
    expose:
      - "8443"
      - "9464" # internal Prometheus /metrics (see ZG_GATEWAY_METRICS_LISTEN below)
    # The image is distroless (no shell, no curl), so the probe is the gateway binary
    # itself: `gateway -health` does one GET /healthz against its own listen port.
    # This is what lets dstack-ingress gate on `service_healthy` above.
    healthcheck:
      test: ["CMD", "/usr/local/bin/gateway", "-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      # Grace before failures count: the gateway must parse config, dial the router,
      # and (with -warm) prime the quote cache before it is "up".
      start_period: 30s
    # Same env-var contract as the sidecar (flag > env var > default). Values are
    # spelled out rather than left to the binary's defaults because this block is
    # measured — a reader should see the configuration app_id commits to. See README
    # "Notes" for the reasoning behind each setting.
    environment:
      # Must stay all-interfaces: a localhost bind (as the sidecar uses) would be
      # unreachable across the compose network.
      - "ZG_GATEWAY_LISTEN=0.0.0.0:8443"
      # Prometheus /metrics on a separate internal listener, never published to the
      # host and not fronted by dstack-ingress, so it is reachable only over the
      # compose network — by the prometheus-agent below. Empty/unset disables it.
      - "ZG_GATEWAY_METRICS_LISTEN=0.0.0.0:9464"
      # The gateway routes per request and derives each provider's enc key + signer
      # from the broker, so no provider or key is configured up front. Unset (prod) →
      # the 0G production router; inject ZG_GATEWAY_ROUTER_URL via the encrypted env
      # (staging) → that URL, listing it in allowed_envs or dstack drops it. The
      # measured text is the ${…} form, so staging and prod share app_id: attestation
      # does not distinguish which router was used, which is acceptable only because
      # the router is untrusted by construction.
      - "ZG_GATEWAY_ROUTER_URL=${ZG_GATEWAY_ROUTER_URL:-https://router-api.0g.ai}"
      # Browser origin allowlist (CORS): the 0G first-party app origins, and
      # deliberately not every origin the router accepts. Keep in sync with
      # openaiproxy.DefaultAllowedOriginsCSV. An empty value turns browser access off
      # entirely; SDK and server-side callers send no Origin header and are
      # unaffected. The localhost entries are development conveniences — drop them via
      # the override on any deployment that does not need them.
      - "ZG_GATEWAY_ALLOWED_ORIGINS=${ZG_GATEWAY_ALLOWED_ORIGINS:-https://0g.ai,https://*.0g.ai,http://localhost:3000,http://localhost:5173}"
      # Request fields sealed end-to-end to the provider (must include "messages"),
      # and cleartext fields excluded from the AAD (an empty value binds everything).
      # Both default to the binary's built-in sets; uncomment to override.
      # - "ZG_GATEWAY_SEAL_FIELDS=messages"
      # - "ZG_GATEWAY_UNBOUND_FIELDS="
      # DCAP-verify each provider's TDX quote and seal only to the verified enc key,
      # instead of trusting the router-supplied pubkey endpoint. Enforced per request:
      # a provider that fails is rejected.
      - "ZG_GATEWAY_ATTEST=true"
      # Reject a provider whose measurement is not in the allowlist instead of only
      # warning. The audited-image allowlist is not wired yet (empty), so enforce
      # would reject ALL providers — leave off until it lands.
      # - "ZG_GATEWAY_ATTEST_ENFORCE=true"
      # Cross-check each provider's quote-bound TEE signer against its acknowledged
      # on-chain teeSignerAddress. The RPC + contract default to 0G mainnet, so they
      # stay implicit; override BOTH together for testnet or your own node.
      - "ZG_GATEWAY_ONCHAIN=true"
      # - "ZG_GATEWAY_CHAIN_RPC_URL=https://evmrpc.0g.ai"
      # - "ZG_GATEWAY_SERVING_CONTRACT=0x47340d900bdFec2BD393c626E12ea0656F938d84"
      # Skip a provider whose on-chain signer is missing/unacknowledged/mismatched
      # instead of only warning. Left OFF: verify-and-warn.
      #
      # Before turning this on, read onchain_grounding_total from /metrics: warn
      # mode is exactly the baseline that says whether enforce is safe here. Every
      # outcome other than ok/ok_stale becomes a skipped candidate once it is on,
      # and if all candidates are skipped the request fails.
      # - "ZG_GATEWAY_ONCHAIN_ENFORCE=true"
      #
      # Note what enforce covers: a provider whose on-chain signer cannot be READ at
      # all (chain RPC unreachable past the cache's 30m grace window) is skipped too,
      # not just one whose signer mismatches — enforce means the chain was actually
      # read. There is no knob to relax that, deliberately: it would be a switch an
      # attacker could throw for us by degrading one RPC endpoint, and since this env
      # block is measured it could not be flipped mid-incident any faster than
      # ONCHAIN_ENFORCE itself. If a chain-RPC outage ever has to be ridden out, the
      # honest lever is turning enforce off.
      #
      # A blip does not reach that decision: eth_call retries with backoff, the
      # result is cached 5m, the warmer refreshes ahead of expiry, and a 30m grace
      # window keeps serving the last known-good reading. Only a sustained outage
      # does — watch onchain_grounding_total{outcome="lookup_failed"} and
      # warmer_signer_refreshes_total{result="failed"} to see it coming.
      # Verify each response's §8 TEE signature (trust-chain hop 11) fail-closed
      # against the quote-bound signer. A response that does not verify is rejected.
      - "ZG_GATEWAY_VERIFY_RESPONSES=true"
      # Fetch Intel PCS collateral from Phala's hosted PCCS instead of Intel's
      # (closest source on this infrastructure; Intel PCS is historically flaky).
      # Only the host is swapped — collateral stays Intel-signed and its validity
      # window is checked, so a hostile mirror can neither forge nor serve expired
      # collateral, and withholding it fails closed. It CAN serve
      # older-but-still-valid CRL / TCB Info, delaying an observed revocation by up
      # to its nextUpdate: a bounded freshness delegation, not a free one.
      - "ZG_GATEWAY_PCCS_URL=https://pccs.phala.network"
      # How long DCAP collateral is memoized by URL. Bounds revocation lag; defaults
      # to 1h, 0 disables.
      # - "ZG_GATEWAY_COLLATERAL_TTL=1h"
      # Background warmer: pre-verify every provider's quote ahead of expiry so
      # requests hit a warm cache instead of paying the DCAP verify inline. Requires
      # ZG_GATEWAY_ATTEST *and* ZG_GATEWAY_ONCHAIN — both on above, so this starts
      # cleanly; enabling it with ONCHAIN off would exit(1) into a restart loop with
      # the ingress up and healthy in front of it. Interval left at its 4m default,
      # under the ~5m quote-cache TTL.
      - "ZG_GATEWAY_WARM=true"
      # - "ZG_GATEWAY_WARM_INTERVAL=4m" # optional; 4m is already the default
      #
      # Soft limit for the Go runtime, and the input the sealed path's in-flight cap
      # is derived from — ZG_GATEWAY_MAX_INFLIGHT is deliberately unset, so the number
      # has one source:
      #
      #   24 GiB / 2 (bodies' share) / ~30 MiB (peak per request) = ~409 in flight
      #
      # Not a replacement for that cap: the cap refuses admission and so bounds LIVE
      # memory, while GOMEMLIMIT is soft — it collects harder and cannot refuse an
      # allocation. ASSUMES a 32 GiB CVM, which nothing here can check, so re-derive
      # on resize. Where 24 comes from and how a wrong value stays quiet: README
      # "CVM shape — and the one setting that depends on it".
      - "GOMEMLIMIT=24GiB"
      # Read this CVM's identity from the file cvm-identity wrote, NOT the
      # guest-agent socket. The empty ZG_GATEWAY_DSTACK_SOCKET is load-bearing: unset
      # it and the binary's default would reinstate the socket path as a fallback,
      # giving the prompt-handling container a privileged runtime surface back.
      - "ZG_GATEWAY_IDENTITY_FILE=/run/identity/identity.json"
      - "ZG_GATEWAY_DSTACK_SOCKET="
    volumes:
      # Identity in, read-only, as a plain JSON file — deliberately not the
      # guest-agent socket, which also derives keys and issues quotes.
      - identity:/run/identity:ro
    # The gateway itself holds no secret: no pinned provider key, and no TLS material
    # — the cert and its key belong to dstack-ingress above.

  # Scrapes the gateway's internal /metrics over the CVM docker network and
  # remote_writes to a central store. AGENT MODE (--enable-feature=agent): no local
  # TSDB, no query API — this CVM is ephemeral, the durable copy lives in the remote
  # store. Neither `ports:` nor `expose:`, so it is reachable only from within the
  # compose network.
  prometheus-agent:
    # The multi-arch INDEX digest, not a per-arch manifest digest — both look equally
    # valid. `docker buildx imagetools inspect prom/prometheus:<tag>` prints it.
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/agent.yml"
      - "--enable-feature=agent"
    configs:
      # Compose mounts this 0444, so the agent (uid 65534/nobody) can read it.
      - source: prom_agent_config
        target: /etc/prometheus/agent.yml
    volumes:
      - identity:/run/identity:ro
    # Load-bearing, not just tidy: both jobs discover their targets from the file_sd
    # documents cvm-identity writes, so until those exist this agent scrapes nothing.
    depends_on:
      cvm-identity:
        condition: service_completed_successfully

volumes:
  cert-data: # SECRET: holds the TLS private key and the ACME account key
  evidences: # public evidence bundle served at /evidences/
  identity: # this CVM's instance_id/app_id, written once by cvm-identity, read-only everywhere else

configs:
  # agent.yml, rendered by COMPOSE (not Prometheus, which does not expand env vars in
  # its own config): the ${…} refs are interpolated from the deploy env at parse time,
  # so the measured compose text holds only the references, never the values. All
  # three vars must be listed in the app's allowed_envs or dstack drops them.
  prom_agent_config:
    content: |
      global:
        scrape_interval: 15s
        external_labels:
          # Stamped on every series pushed, so a shared store can tell this
          # gateway apart from other services (service) and this deployment's
          # environment from the other (env). These CANNOT separate replicas —
          # two CVMs of one app_id run this exact config — which is what the
          # per-job file_sd target labels below are for.
          service: 0g-pc-gateway
          env: "${ZG_PROM_ENV:?set staging or mainnet}"
      scrape_configs:
        # Both jobs take their per-replica identity as TARGET labels from the
        # documents cvm-identity wrote; nothing is labelled exporter-side.
        # Prometheus synthesises `up` and the scrape_* series from target labels
        # alone, so a label the exporter stamps on its own series cannot reach
        # them — static_configs here would leave all five byte-identical between
        # two replicas, colliding on the signal most worth alerting on.
        - job_name: gateway
          file_sd_configs:
            - files: ["/run/identity/sd/gateway.json"]
        # The agent's own series — remote_write queue depth, send failures: the
        # signal that tells you a replica has gone deaf.
        - job_name: prometheus-agent
          file_sd_configs:
            - files: ["/run/identity/sd/prom-agent.json"]
      remote_write:
        - url: "${ZG_PROM_REMOTE_WRITE_URL:?set the remote_write endpoint, e.g. https://prometheus.example.com/api/v1/write}"
          basic_auth:
            username: "${ZG_PROM_REMOTE_WRITE_USERNAME:?set the remote_write basic_auth username}"
            password: "${ZG_PROM_REMOTE_WRITE_PASSWORD:?set the remote_write basic_auth password}"
