# Phala Cloud (dstack) deployment for the 0G-PC cloud-TEE gateway.
#
# This runs the `gateway` — the SAME client core as the sidecar, but server-run
# and 0G-operated, meant to run inside an attested CVM (see
# docs/design/cloud-gateway.md §7). dstack's ZT-HTTPS front end terminates TLS
# *inside the enclave* and forwards plaintext to the container, so the gateway
# listens on a plain HTTP socket here — it must NOT do TLS itself.
#
# dstack/tproxy ingress maps container ports to a public HTTPS URL:
#   https://<app-id>-8443.<base_domain>   ->  port 8443 in this CVM
# (the `<app-id>.<base_domain>` form maps to 80/443; the `-<port>` form maps to
# that port. A trailing `s` — `<app-id>-8443s.<base_domain>` — would forward
# encrypted TCP for an app that terminates TLS itself; we don't, dstack does.)
#
# Deploy: reference this compose file from the Phala Cloud dashboard, or via the
# Phala CLI (`phala cvm create --compose deploy/phala/docker-compose.yml`).

services:
  gateway:
    # Published by .github/workflows/docker.yml to GHCR.
    #
    # NOTE: in a TEE the compose file is *measured* into the CVM's attestation,
    # so a floating tag makes the measurement change unpredictably. For a
    # reproducible deployment, pin to an immutable digest instead of `:latest`,
    # e.g.:
    #   image: ghcr.io/0gfoundation/0g-pc-e2ee-gateway@sha256:<digest>
    image: ghcr.io/0gfoundation/0g-pc-e2ee-gateway:latest
    restart: unless-stopped
    ports:
      # host:container — dstack tproxy forwards the public ingress to the host
      # side, so this port is what appears as `<app-id>-8443.<base_domain>`.
      - "8443:8443"
    # Every startup parameter also reads from a ZG_GATEWAY_* environment
    # variable (precedence: command-line flag > env var > built-in default), so
    # it can be set here in the measured `environment:` block instead of via
    # `command:`. This block is what dstack measures into the CVM attestation.
    environment:
      # Bind to all interfaces (the binary defaults to localhost, which would be
      # container-local only) so dstack can forward to it.
      - "ZG_GATEWAY_LISTEN=0.0.0.0:8443"
      # The gateway routes per request and derives each provider's enc key +
      # signer from the broker, so no provider/key is configured up front. It
      # defaults to the 0G router; uncomment to override.
      # - "ZG_GATEWAY_ROUTER_URL=https://router-api.0g.ai"
      # Request fields sealed end-to-end to the provider (must include
      # "messages"). Defaults to the binary's built-in set; uncomment to override.
      # - "ZG_GATEWAY_SEAL_FIELDS=messages"
      # Cleartext fields excluded from the AAD (intermediary-mutable, untrusted);
      # an empty value binds everything. Defaults to the built-in set; uncomment
      # to override.
      # - "ZG_GATEWAY_UNBOUND_FIELDS="
      # DCAP-verify each provider's TDX quote and seal only to the verified enc
      # key, instead of trusting the router-supplied pubkey endpoint. Enabled
      # here: quote authenticity (genuine TDX, TCB up to date, report_data
      # binding) is enforced per request; a provider that fails it is rejected.
      - "ZG_GATEWAY_ATTEST=true"
      # With ZG_GATEWAY_ATTEST, reject a provider whose measurement is not in the
      # allowlist instead of only warning. The audited-image allowlist is not
      # wired yet (empty), so enforce currently rejects ALL providers — leave it
      # off until the allowlist lands, so ATTEST runs in verify-and-warn mode.
      # - "ZG_GATEWAY_ATTEST_ENFORCE=true"
      # Cross-check each provider's quote-bound TEE signer against its acknowledged
      # on-chain teeSignerAddress (InferenceServing registry). Requires
      # ZG_GATEWAY_ATTEST. Defaults to off. The RPC + contract default to 0G
      # mainnet; override both together for testnet or your own node.
      # - "ZG_GATEWAY_ONCHAIN=true"
      # - "ZG_GATEWAY_CHAIN_RPC_URL=https://evmrpc.0g.ai"
      # - "ZG_GATEWAY_SERVING_CONTRACT=0x47340d900bdFec2BD393c626E12ea0656F938d84"
      # With ZG_GATEWAY_ONCHAIN, skip a provider whose on-chain signer is
      # missing/unacknowledged/mismatched instead of only warning. Defaults to off.
      # - "ZG_GATEWAY_ONCHAIN_ENFORCE=true"
    # No secrets or volumes: the gateway holds no pinned provider key, and TLS
    # material is managed by dstack-kms inside the enclave, never by this file.
