# HAProxy for the 0G-PC gateway on tapp. Terminates TLS INSIDE the CVM and hands
# the gateway plaintext over the compose network, the job dstack-ingress does on
# Phala. Uploaded with the compose by `tapp-cli start-app` (it appears under
# `volumes:`), so it is measured: every byte here, comments included, is part of
# what the attestation commits to.
#
# Cloud-neutral: tapp runs on GCP, Alibaba Cloud and bare metal, and nothing here
# depends on which. The one requirement on the platform is an L4 load balancer in
# front that forwards TCP without decrypting it and prepends a PROXY header (v1 or
# v2). For example, GCP's global TCP proxy load balancer sends v1.
#
# The chain a request takes:
#   client --TLS--> L4 load balancer (forwards bytes, never decrypts)
#     --PROXY v1/v2 + TLS--> :8443 here (accept-proxy; TLS ends here, in the TEE)
#     --PROXY v2 + plaintext--> gateway:8443 (ZG_GATEWAY_PROXY_PROTOCOL=true)
# The gateway accepts only v2 (client/cmd/internal/proxyproto). `accept-proxy`
# reads either version and `send-proxy-v2` re-emits v2, so the gateway is the same
# on every platform. The three switches go together or not at all: the load
# balancer's PROXY setting, `accept-proxy` below and the gateway's flag.
#
# Why the PROXY header is believed: 443 on the VM must be reachable ONLY from the
# load balancer, enforced by the platform's firewall (on GCP: source ranges
# 35.191.0.0/16 and 130.211.0.0/22). Anything else that can reach it can name any
# client address it likes. The address is for rate limiting and abuse control,
# never for anything the attestation proves.

global
    # No `log` line, on purpose: nothing about connections is written anywhere, so
    # client addresses never reach a log.
    maxconn 4096
    # Drop root once the key is loaded. The container starts as root only so the
    # crt-store below can read the root-owned, mode-600 key that tls-init wrote;
    # certificates and keys are loaded before this takes effect. The worker, the
    # only process that touches traffic (the one public TLS endpoint of this TEE),
    # then runs as the image's haproxy user (uid/gid 99). The master stays root
    # and handles no traffic.
    user haproxy
    group haproxy
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

# Docker's embedded DNS, so a gateway container recreated with a new address is
# found again without restarting HAProxy (dstack-ingress resolves once at startup).
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

defaults
    mode tcp
    timeout connect 5s
    # Idle timeouts, not request deadlines: a streamed completion keeps the
    # connection busy, so these only close connections that have gone silent.
    timeout client 10m
    timeout server 10m

# The certificate is issued by a public CA for a CSR from `tapp-cli get-app-csr`
# and shipped next to this file (it is public). The key is the app's KMS-derived
# TLS key, fetched by the tls-init sidecar into tmpfs; with tls_key_source=kms it is
# identical on every node of the app, so one certificate serves every region.
crt-store tapp
    load crt "/etc/haproxy/tls/fullchain.pem" key "/run/tls/tls.key" alias "gateway"

frontend public
    # Plain HTTP/1.1 behind TLS: the gateway is a cleartext net/http server and
    # does not speak h2c, so do not offer h2 here.
    bind :8443 ssl crt "@tapp/gateway" alpn http/1.1 accept-proxy
    default_backend gateway

backend gateway
    # check-send-proxy: the gateway refuses any non-loopback connection that does
    # not open with a v2 header, health checks included.
    server gw gateway:8443 send-proxy-v2 check check-send-proxy resolvers docker init-addr last,libc,none

# Load balancer health check. A separate port WITHOUT accept-proxy: health checks
# (GCP's among them) send no PROXY header. Answers 200 only while the gateway backend is up, so
# a node whose gateway is down drops out of the LB.
frontend health
    mode http
    bind :8080
    acl gateway_up nbsrv(gateway) gt 0
    http-request return status 200 content-type text/plain string "ok" if gateway_up
    http-request return status 503 content-type text/plain string "gateway down"
