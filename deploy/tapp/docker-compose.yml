# tapp deployment for the 0G-PC cloud-TEE gateway. DRAFT, first exercised by a PoC
# on GCP (Intel TDX, project pc-gateway-staging); the Phala deployment
# (deploy/phala/) is unchanged and stays in service alongside this one.
#
# Cloud-neutral: tapp runs on GCP, Alibaba Cloud and bare metal, and this file
# assumes none of them. The platform supplies an L4 load balancer that forwards TCP
# without decrypting it and sends a PROXY header (haproxy.cfg), plus a firewall that
# keeps everything else off 443. Those live with the infrastructure, not here.
#
# The same gateway image as on Phala, behind an HAProxy that terminates TLS inside
# this CVM. Three containers:
#   tls-init  one-shot: fetches the app's KMS-derived TLS key over the tapp socket
#   haproxy   TLS termination (key never leaves the TEE), PROXY v1 -> v2
#   gateway   unchanged client core; reached only through haproxy
#
# The one-shot container and restarts: `depends_on` orders only `compose up`, so a
# container Docker restarts on its own does not rerun them. That is safe here:
# within a boot its result persists (the TLS key stays in /run, which is tmpfs and
# outlives container and daemon restarts), and a VM
# reboot leaves nothing to restart, because tapp's Docker data-root is a volume
# recreated empty at every boot (0g-tapp cvm/README.md, "/data is the runtime
# volume"). After a reboot only start-app brings the app back, and that runs the
# one-shot again.
#
# Deploy with `tapp-cli start-app -f docker-compose.yml --app-id <id>
# --register-onchain ...`, from this directory, after `cp env/<target>.env .env`.
# EVERY byte of this file, and of each file it mounts from here (haproxy.cfg, .env,
# secrets.env, tls/fullchain.pem), is measured by tapp and committed to on chain.
# Secrets go in secrets.env ONLY: tapp publishes a mounted file's hash, never its
# contents, and keeping them out of .env leaves .env reproducible by a verifier.
#
# Not here yet, compared with deploy/phala (README.md "Open items"):
#   - no evidence bundle, nonce quote (GET /evidence) or identity file: those read
#     dstack's guest agent and need a tapp adapter in the gateway;
#   - no prometheus-agent.

services:
  # Fetches this app's TLS key (and a self-signed certificate nobody uses) into
  # tmpfs, then exits. With tls_key_source=kms (claim-config) the key comes from the
  # KMS cluster, is the same on every node of the app and survives restarts, which
  # is what lets one CA certificate serve every replica in every region.
  tls-init:
    # The most privileged container: it holds the tapp socket, through which every
    # app's key material can be read. So it is pinned by digest like everything
    # else: a re-pointed tag must not swap the program while the recorded hash stays
    # the same. v0.4.0 is enough: GetAppTlsCert is socket-only and unsigned, so this
    # client works against any later tapp-server, and the key source (kms) is the
    # server's setting.
    #
    # Built here from deploy/tapp/tls-init/Dockerfile (debian-slim by digest +
    # the tapp-cli v0.11.1 release binary, checked by ADD --checksum) and published
    # publicly by .github/workflows/docker.yml, so anyone can pull this digest and
    # audit it. Built from commit 310502d (tag sha-310502d…). On a change to that
    # Dockerfile, pin the new build's digest here.
    image: ghcr.io/0gfoundation/0g-pc-e2ee-tls-init@sha256:a146bdf7fb7bd5acad9b909fcfbc3f26c42f36cb43d343684bd8d86c0d5e3fec
    command:
      - --server=/run/tapp/tapp.sock
      - get-app-tls-cert
      - --app-id=${TAPP_APP_ID:?set TAPP_APP_ID in .env, equal to start-app --app-id}
      - --out-key=/certs/tls.key
      - --out-cert=/certs/tls.crt
    restart: "no"
    volumes:
      # The only contact with tapp. Any process holding this socket can read every
      # app's key material, so no other container mounts it.
      - /run/tapp/tapp.sock:/run/tapp/tapp.sock
      # /run is tmpfs: the key stays in TEE memory and is gone at reboot. Never a
      # named volume (that would put the key on disk).
      - /run/${TAPP_APP_ID}-certs:/certs
      # Nothing else: not .env, not secrets.env. Least privilege for the container
      # that holds the socket.

  haproxy:
    image: haproxy:3.0.12-alpine@sha256:e3229153dd6429fc71f8a9a1f1ccbf8dab6962422d7043c81e84dd6a075e90ee
    restart: unless-stopped
    # Starts as root only to read the key tls-init wrote root-owned (mode 600);
    # haproxy.cfg's `user haproxy` / `group haproxy` drop the traffic-handling worker
    # to uid/gid 99 right after. No capabilities beyond the two that drop needs (it
    # binds 8443/8080, so no NET_BIND_SERVICE), and no regaining privileges later.
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    depends_on:
      tls-init:
        condition: service_completed_successfully
      gateway:
        condition: service_healthy
    ports:
      # Reachable only from the load balancer and its health checks; the platform's
      # firewall enforces that (haproxy.cfg header).
      - "443:8443"
      - "8080:8080"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      # Public: issued by a CA for the CSR from `tapp-cli get-app-csr`, written here
      # by the deploy pipeline before start-app. Not committed; a verifier gets the
      # same bytes from the TLS handshake.
      - ./tls/fullchain.pem:/etc/haproxy/tls/fullchain.pem:ro
      - /run/${TAPP_APP_ID}-certs:/run/tls:ro

  gateway:
    # The release workflow substitutes a digest, as for deploy/phala.
    image: ghcr.io/0gfoundation/0g-pc-e2ee-gateway:latest
    restart: unless-stopped
    # No `ports:`: only haproxy can reach 8443, which is what makes the PROXY header
    # it sends believable.
    expose:
      - "8443"
      - "9464"
    # ZG_GATEWAY_CLIENT_IP_KEY and ZG_GATEWAY_ALLOWED_ORIGINS, written by the deploy
    # pipeline from its secret store (secrets.env.example). Not in `environment:`
    # below, which would override them. The gateway starts even when they are empty
    # (an empty value turns its feature off), so the pipeline refuses to deploy
    # without them; nothing on the node checks.
    env_file:
      - ./secrets.env
    healthcheck:
      test: ["CMD", "/usr/local/bin/gateway", "-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    environment:
      - "ZG_GATEWAY_LISTEN=0.0.0.0:8443"
      - "ZG_GATEWAY_PROXY_PROTOCOL=true"
      - "ZG_GATEWAY_METRICS_LISTEN=0.0.0.0:9464"
      - "ZG_GATEWAY_ROUTER_URL=${ZG_GATEWAY_ROUTER_URL:?set ZG_GATEWAY_ROUTER_URL in .env}"
      - "ZG_GATEWAY_SEAL_MODELS=${ZG_GATEWAY_SEAL_MODELS-0gm-1.0-35b-a3b}"
      - "ZG_GATEWAY_ATTEST=true"
      - "ZG_GATEWAY_ATTEST_ENFORCE=true"
      - "ZG_GATEWAY_ONCHAIN=true"
      - "ZG_GATEWAY_NETWORK=${ZG_GATEWAY_NETWORK:?set ZG_GATEWAY_NETWORK in .env}"
      - "ZG_GATEWAY_ONCHAIN_ENFORCE=true"
      - "ZG_GATEWAY_VERIFY_RESPONSES=true"
      # Collateral for verifying PROVIDER quotes, unrelated to where the gateway runs.
      - "ZG_GATEWAY_PCCS_URL=https://pccs.phala.network"
      - "ZG_GATEWAY_WARM=true"
      # Set per machine shape: physical RAM less the OS (tapp's root filesystem is a
      # RAM overlay), haproxy and slack. deploy/phala/README.md "CVM shape".
      - "GOMEMLIMIT=${GOMEMLIMIT:?set GOMEMLIMIT in .env for this machine shape}"
      - "ZG_GATEWAY_MAX_INFLIGHT=${ZG_GATEWAY_MAX_INFLIGHT:-}"
      # dstack-only inputs, off on tapp: no guest-agent socket, no identity file,
      # no evidence bundle, no quoter, no app-compose file.
      - "ZG_GATEWAY_DSTACK_SOCKET="
      - "ZG_GATEWAY_IDENTITY_FILE="
      - "ZG_GATEWAY_EVIDENCE_DIR="
      - "ZG_GATEWAY_QUOTER_URL="
      - "ZG_GATEWAY_APP_COMPOSE_FILE="
    volumes:
      # Mounted so start-app uploads these with the compose: .env feeds the ${...}
      # substitutions in this file, secrets.env is the env_file above. Both are
      # measured; secrets.env only as a hash. The gateway gets these values anyway,
      # and tls-init, which holds the tapp socket, mounts neither.
      - ./.env:/run/deploy.env:ro
      - ./secrets.env:/run/secrets.env:ro
